# Minimal reproducible example demonstrating Vacuum v0.33.0 schema-order dependent example check.
# Issue: https://github.com/brawler2011/gate/issues/142
#
# When components.schemas is ordered as (First, UploadBody), Vacuum reports 0 missing-example warnings.
# When components.schemas is reversed to (UploadBody, First), Vacuum reports:
#   "schema property `file` is missing `examples` or `example`" on UploadBody.file,
# despite UploadBody having a whole-object example.

openapi: 3.0.3
info:
  title: Probe
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: Upload
      summary: Upload file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadBody'
      responses:
        '204':
          description: Uploaded
  /first:
    get:
      operationId: First
      summary: Read first model
      responses:
        '200':
          description: First model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/First'
components:
  schemas:
    First:
      type: object
      properties:
        message:
          type: string
          example: error
      example:
        message: error
    UploadBody:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
      example:
        file: (file content)
