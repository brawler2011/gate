name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate PR Title Format & Length
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bun run commit:validate
