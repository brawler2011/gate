name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      domain_name: steins.ru
      deploy_dir: ~/gate/deploy/prod
    secrets: inherit
