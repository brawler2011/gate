name: Deploy Production

on:
  push:
    branches: [main]
  # Rollback: run with the commit of a previous release.
  workflow_dispatch:
    inputs:
      release:
        description: 'Full SHA of a main commit to redeploy (default: the head of main)'
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      release: ${{ inputs.release || github.sha }}
    secrets: inherit
