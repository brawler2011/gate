name: CI

on:
  workflow_dispatch:
  # Every PR, including PRs stacked on other PR branches.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Images are pushed only from this repository; PRs from forks cannot write to GHCR.
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  codegen-check:
    name: Codegen Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenAPI contracts
        run: task lint:contracts

      - name: Verify Codegen Freshness
        run: task diff:codegen

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task golangci-lint github:sbdchd/squawk

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Run backend linter
        run: task lint:be

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Run unit tests
        run: task test:be

  # Images are built once per content and pushed under immutable tags, so deploy
  # promotes exactly what CI tested. The judge image is named by tools/judgeimage
  # (content hash of judge/), the backend tag is the git tree of the whole checkout
  # (unchanged by a squash merge of an up-to-date PR).
  judge-image:
    name: Judge Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go

      - name: Compute image name
        id: tag
        run: echo "image=$(go run ./tools/judgeimage)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        if: env.PUSH_IMAGES == 'true'
        # Only a single image manifest counts: tags pushed with attestations are
        # indexes with another digest per build, so they are rebuilt and replaced.
        run: |
          media="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2> /dev/null | jq -r .mediaType || true)"
          case "$media" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "$IMAGE already exists; skipping the build." ;;
            "") echo "$IMAGE does not exist yet." ;;
            *) echo "$IMAGE is a $media; rebuilding it as a single manifest." ;;
          esac
        env:
          IMAGE: ${{ steps.tag.outputs.image }}

      # Forks cannot push; their integration job builds the image instead.
      - name: Install Nix
        if: env.PUSH_IMAGES == 'true' && steps.existing.outputs.found != 'true'
        uses: cachix/install-nix-action@v31

      # Keeps the store between runs, so only derivations whose inputs changed are
      # rebuilt or substituted again. One cache per ref; older ones are purged.
      - name: Cache Nix store
        if: env.PUSH_IMAGES == 'true' && steps.existing.outputs.found != 'true'
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-judge-${{ hashFiles('judge/**') }}
          restore-prefixes-first-match: nix-judge-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-judge-
          purge-created: 0
          purge-primary-key: never

      # Pushes the layers as Nix built them (uncompressed, digests known before the
      # push), so the registry skips existing layers and identical sources give the
      # same image digest.
      - name: Build and push judge image
        if: env.PUSH_IMAGES == 'true' && steps.existing.outputs.found != 'true'
        run: nix run ./judge#default.copyTo -- --preserve-digests "docker://$IMAGE"
        env:
          IMAGE: ${{ steps.tag.outputs.image }}

  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "image=ghcr.io/brawler2011/gate-backend:$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        if: env.PUSH_IMAGES == 'true'
        # Only a single image manifest counts: tags pushed with attestations are
        # indexes with another digest per build, so they are rebuilt and replaced.
        run: |
          media="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2> /dev/null | jq -r .mediaType || true)"
          case "$media" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "$IMAGE already exists; skipping the build." ;;
            "") echo "$IMAGE does not exist yet." ;;
            *) echo "$IMAGE is a $media; rebuilding it as a single manifest." ;;
          esac
        env:
          IMAGE: ${{ steps.tag.outputs.image }}

      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tag.outputs.image }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          # One plain manifest per tag: rebuilding identical sources keeps the digest.
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  backend-integration-tests:
    name: Backend Integration Tests
    needs: judge-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task

      # Its own key: the shared key is usually saved by a job that never builds the
      # integration-tagged packages, so this job downloaded and compiled them every run.
      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-integration-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-integration-
            ${{ runner.os }}-go-

      # A separate step, so compile time shows apart from test time.
      - name: Build integration tests
        run: go test -tags=integration -run '^$' ./backend/tests/integration/...

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Judge Image pushed it, so a failed pull is an error, not a reason to build.
      # Forks skip this; `task judge:image` builds the image for them.
      - name: Prepare go-judge image
        if: env.PUSH_IMAGES == 'true'
        run: docker pull "$(go run ./tools/judgeimage)"

      - name: Run integration tests
        run: task test:be:integration

  migration-rollback:
    name: Migration Rollback Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # See docs/design/migrations.md. Runs the tests only when migrations change.
      - name: Compare migrations with the base branch
        id: migrations
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual run compares with the base of the branch's open PR, so a stacked
          # branch is not blamed for its parent's changes.
          base_ref="$PR_BASE"
          if [ -z "$base_ref" ]; then
            pr_base="$(gh pr view "$BRANCH" --json baseRefName --jq .baseRefName 2> /dev/null || true)"
            base_ref="origin/${pr_base:-main}"
          fi
          base="$(git merge-base "$base_ref" HEAD)"
          changed="$(git diff --name-status "$base" HEAD -- backend/migrations)"
          if [ -n "$changed" ] && grep -v '^A' <<< "$changed"; then
            echo "::error::Merged migrations are immutable; only new files may be added."
            exit 1
          fi
          # goose refuses a migration older than one already applied to a database.
          latest="$(git ls-tree --name-only "$base" backend/migrations/ | sed -n 's|.*/\([0-9]*\)_.*|\1|p' | sort -n | tail -n 1)"
          while read -r _ path; do
            [ -n "$path" ] || continue
            version="$(basename "$path" | cut -d _ -f 1)"
            if [ "$version" -le "${latest:-0}" ]; then
              echo "::error::$path must have a version newer than $latest, the newest migration on the base branch."
              exit 1
            fi
          done <<< "$changed"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "changed=$([ -n "$changed" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up project tools
        if: steps.migrations.outputs.changed == 'true'
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task

      - name: Cache Go modules and build artifacts
        if: steps.migrations.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-integration-${{ hashFiles('mise.toml', '**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-integration-
            ${{ runner.os }}-go-

      - name: Log in to GitHub Container Registry
        if: steps.migrations.outputs.changed == 'true' && env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base branch's code and judge image, with this branch's migrations.
      - name: Run base integration tests on these migrations
        if: steps.migrations.outputs.changed == 'true'
        run: task test:migrations:rollback BASE=${{ steps.migrations.outputs.base }}

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: bun task

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: task typecheck:fe

      - name: Run linter
        run: task lint:fe

      - name: Run dead code check (Knip)
        run: task knip:fe

      - name: Run frontend tests
        run: bun run test

      - name: Run production build check
        run: task build:fe
        env:
          NODE_ENV: production

  ci-status:
    name: All CI Checks Passed
    needs:
      - codegen-check
      - backend-lint
      - backend-unit-tests
      - backend-integration-tests
      - migration-rollback
      - frontend-checks
      - judge-image
      - backend-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          echo "Codegen: ${{ needs.codegen-check.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Migration Rollback Test: ${{ needs.migration-rollback.result }}"
          echo "Frontend Checks: ${{ needs.frontend-checks.result }}"
          echo "Judge Image: ${{ needs.judge-image.result }}"
          echo "Backend Image: ${{ needs.backend-image.result }}"

          if [[ "${{ needs.codegen-check.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.migration-rollback.result }}" != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" || \
                "${{ needs.judge-image.result }}" != "success" || \
                "${{ needs.backend-image.result }}" != "success" ]]; then
            echo "ERROR: One or more CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
