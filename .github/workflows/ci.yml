name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen-check:
    name: Codegen Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenAPI contracts
        run: task lint:contracts

      - name: Verify Codegen Freshness
        run: task diff:codegen

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task golangci-lint

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Run backend linter
        run: task lint:be

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Run unit tests
        run: task test:be

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go task

      - name: Cache Go modules and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', '**/go.sum') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare go-judge image
        uses: docker/build-push-action@v7
        with:
          context: deploy/common/judge
          file: deploy/common/judge/Dockerfile
          tags: gate-gojudge:ci
          load: true
          cache-from: type=gha,scope=gojudge
          cache-to: type=gha,scope=gojudge,mode=max

      - name: Run integration tests
        run: task test:be:integration
        env:
          GOJUDGE_TEST_IMAGE: gate-gojudge:ci

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: bun task

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: task typecheck:fe

      - name: Run linter
        run: task lint:fe

      - name: Run dead code check (Knip)
        run: task knip:fe

      - name: Run frontend tests
        run: bun run test

      - name: Run production build check
        run: task build:fe
        env:
          NODE_ENV: production

  app-docker-build:
    name: Application Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build Go application with static SPA
        run: docker build --progress=plain --file Dockerfile --tag gate:ci .

  ci-status:
    name: All CI Checks Passed
    needs:
      - codegen-check
      - backend-lint
      - backend-unit-tests
      - backend-integration-tests
      - frontend-checks
      - app-docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          echo "Codegen: ${{ needs.codegen-check.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Checks: ${{ needs.frontend-checks.result }}"
          echo "Frontend Docker Build: ${{ needs.app-docker-build.result }}"

          if [[ "${{ needs.codegen-check.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" || \
                "${{ needs.app-docker-build.result }}" != "success" ]]; then
            echo "ERROR: One or more CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
