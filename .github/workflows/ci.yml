name: CI

on:
  pull_request:
    branches: [ main, dev ]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: ${{ matrix.job.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        job:
          - id: backend-lint
            name: Backend Lint
            type: go
          - id: backend-unit-tests
            name: Backend Unit Tests
            type: go
          - id: backend-integration-tests
            name: Backend Integration Tests
            type: go
          - id: frontend-checks
            name: Frontend Typecheck & Lint
            type: bun

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        if: matrix.job.type == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        if: matrix.job.id == 'backend-lint'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.6
          working-directory: backend

      - name: Run unit tests
        if: matrix.job.id == 'backend-unit-tests'
        working-directory: backend
        run: go test -v ./...

      - name: Run integration tests
        if: matrix.job.id == 'backend-integration-tests'
        working-directory: backend
        run: go test -v -tags=integration ./tests/integration/...

      - name: Set up Bun
        if: matrix.job.type == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: matrix.job.type == 'bun'
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run typecheck
        if: matrix.job.id == 'frontend-checks'
        working-directory: frontend
        run: bun run typecheck

      - name: Run linter
        if: matrix.job.id == 'frontend-checks'
        working-directory: frontend
        run: bun run lint

      - name: Run dead code check (Knip)
        if: matrix.job.id == 'frontend-checks'
        working-directory: frontend
        run: bun run knip


