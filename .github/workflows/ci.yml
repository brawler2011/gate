name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen-check:
    name: Codegen Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Verify Codegen Freshness
        run: task verify-codegen

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run backend linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        run: task be:test

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        run: task be:test-integration

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: task fe:typecheck

      - name: Run linter
        run: task fe:lint

      - name: Run dead code check (Knip)
        run: task fe:knip

      - name: Run production build check
        run: task fe:build

  ci-status:
    name: All CI Checks Passed
    needs:
      - codegen-check
      - backend-lint
      - backend-unit-tests
      - backend-integration-tests
      - frontend-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          echo "Codegen: ${{ needs.codegen-check.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Checks: ${{ needs.frontend-checks.result }}"

          if [[ "${{ needs.codegen-check.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "ERROR: One or more CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
