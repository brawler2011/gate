name: CI

on:
  workflow_dispatch:
  # Warm default-branch caches for new PRs.
  push:
    branches: [main]
  # Include PRs targeting other PR branches.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUSH_IMAGES: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  codegen-check:
    name: Codegen Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-go

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenAPI contracts
        run: task contracts:lint

      - name: Verify Codegen Freshness
        run: task gen:check

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-go
        with:
          tools: go task golangci-lint

      - name: Run backend linter
        run: task be:lint

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-go
        with:
          tools: go task

      - name: Run unit tests
        run: task be:test

  # Use content tags so deploy promotes the exact images CI tested.
  judge-image:
    name: Image (${{ matrix.image }})
    strategy:
      matrix:
        image: [judge, typeset]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-tools
        with:
          tools: go

      - name: Compute image name
        id: tag
        run: echo "image=$(go run ./tools/judgeimage ${{ matrix.image }})" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        if: env.PUSH_IMAGES == 'true'
        # Attestation indexes change digest on rebuild; accept only plain manifests.
        run: |
          media="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2> /dev/null | jq -r .mediaType || true)"
          case "$media" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "$IMAGE already exists." ;;
            "") echo "$IMAGE does not exist yet." ;;
            *) echo "$IMAGE is a $media; rebuilding it as a single manifest." ;;
          esac
        env:
          IMAGE: ${{ steps.tag.outputs.image }}

      # Forks cannot push, so integration tests build their image locally.
      - name: Install Nix
        if: env.PUSH_IMAGES == 'true' && (steps.existing.outputs.found != 'true' || github.ref == 'refs/heads/main')
        uses: cachix/install-nix-action@v31

      # Restore earlier Nix stores to reuse unchanged toolchains.
      - name: Cache Nix store
        id: nix-cache
        if: env.PUSH_IMAGES == 'true' && (steps.existing.outputs.found != 'true' || github.ref == 'refs/heads/main')
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: ${{ matrix.image }}-nix-store-${{ hashFiles(format('{0}/**', matrix.image)) }}
          restore-prefixes-first-match: ${{ matrix.image }}-nix-store-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: ${{ matrix.image }}-nix-store-
          purge-created: 0
          purge-primary-key: never

      # Warm main's cache without replacing a tested tag during a concurrent deploy.
      - name: Warm main Nix cache
        if: env.PUSH_IMAGES == 'true' && github.ref == 'refs/heads/main' && steps.existing.outputs.found == 'true' && steps.nix-cache.outputs.hit-primary-key != 'true'
        run: |
          started=$SECONDS
          nix build --no-link ./$SOURCE#default ./$SOURCE#default.copyTo
          echo "$SOURCE cache warm-up: $((SECONDS - started)) seconds (ref: $GITHUB_REF)." >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE: ${{ matrix.image }}

      # Fixed compression keeps digests reproducible; changed images still recompress every layer.
      - name: Build and push image
        if: env.PUSH_IMAGES == 'true' && steps.existing.outputs.found != 'true'
        run: |
          started=$SECONDS
          nix run ./$SOURCE#default.copyTo -- --dest-compress-format zstd --dest-compress-level 3 "docker://$IMAGE"
          echo "$SOURCE image build and push: $((SECONDS - started)) seconds (ref: $GITHUB_REF)." >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SOURCE: ${{ matrix.image }}

  backend-image:
    name: Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Compute image tag
        id: tag
        run: echo "image=ghcr.io/brawler2011/gate-backend:$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: existing
        if: env.PUSH_IMAGES == 'true'
        run: |
          media="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' 2> /dev/null | jq -r .mediaType || true)"
          case "$media" in
            application/vnd.oci.image.manifest.v1+json|application/vnd.docker.distribution.manifest.v2+json)
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "$IMAGE already exists; skipping the build." ;;
            "") echo "$IMAGE does not exist yet." ;;
            *) echo "$IMAGE is a $media; rebuilding it as a single manifest." ;;
          esac
        env:
          IMAGE: ${{ steps.tag.outputs.image }}

      - name: Set up Docker Buildx
        if: steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build backend image
        if: steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.tag.outputs.image }}
          push: ${{ env.PUSH_IMAGES == 'true' }}
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  backend-integration-tests:
    name: Backend Integration Tests
    needs: judge-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-go
        with:
          tools: go task

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: task be:test:integration

      - name: Check query work
        run: task be:querywork

  deploy-lint:
    name: Deploy Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-tools
        with:
          tools: task helm

      - name: Lint Helm charts
        run: task deploy:lint

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up project tools
        uses: ./.github/actions/setup-tools
        with:
          tools: bun task

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: task fe:typecheck

      - name: Run linter
        run: task fe:lint

      - name: Run dead code check (Knip)
        run: task fe:knip

      - name: Run frontend tests
        run: task fe:test

      - name: Run production build check
        run: task fe:build
        env:
          NODE_ENV: production

  ci-status:
    name: All CI Checks Passed
    needs:
      - codegen-check
      - backend-lint
      - backend-unit-tests
      - backend-integration-tests
      - deploy-lint
      - frontend-checks
      - judge-image
      - backend-image
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          echo "Codegen: ${{ needs.codegen-check.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Deploy Lint: ${{ needs.deploy-lint.result }}"
          echo "Frontend Checks: ${{ needs.frontend-checks.result }}"
          echo "Judge Image: ${{ needs.judge-image.result }}"
          echo "Backend Image: ${{ needs.backend-image.result }}"

          if [[ "${{ needs.codegen-check.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.deploy-lint.result }}" != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" || \
                "${{ needs.judge-image.result }}" != "success" || \
                "${{ needs.backend-image.result }}" != "success" ]]; then
            echo "ERROR: One or more CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
