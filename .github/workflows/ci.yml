name: CI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codegen-check:
    name: Codegen Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Validate OpenAPI contracts
        run: task contracts:lint

      - name: Verify Codegen Freshness
        run: task verify-codegen

  tools-tests:
    name: Repository Tool Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tools/commitvalidator/go.mod
          cache: false

      - name: Run repository tool tests
        run: task tools:test

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run backend linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run unit tests
        run: task be:test

      - name: Run deployment checks
        run: task test:e2e

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run integration tests
        run: task be:test-integration

  frontend-checks:
    name: Frontend Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Task
        uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: task fe:typecheck

      - name: Run linter
        run: task fe:lint

      - name: Run dead code check (Knip)
        run: task fe:knip

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

      - name: Run production build check
        run: task fe:build
        env:
          NODE_ENV: production
          BACKEND_API_URL: http://localhost:8080
          NEXT_PUBLIC_BACKEND_API_URL: /api
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8080/ws

  frontend-docker-build:
    name: Frontend Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build clean frontend image
        run: |
          docker build --no-cache --progress=plain \
            --build-arg BACKEND_API_URL=http://backend:8080 \
            --build-arg NEXT_PUBLIC_BACKEND_API_URL=/api \
            --build-arg NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:8080/ws \
            --tag gate-frontend:ci frontend

      - name: Verify frontend runtime configuration
        run: |
          docker run --detach --name frontend-config-check \
            --publish 127.0.0.1:3000:3000 \
            --env BACKEND_API_URL=http://runtime-backend:8080 \
            --env NEXT_PUBLIC_APP_URL=http://runtime-override.invalid \
            gate-frontend:ci
          trap 'docker logs frontend-config-check; docker rm --force frontend-config-check' EXIT
          curl --fail --silent --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/robots.txt > /tmp/frontend-robots.txt
          grep --fixed-strings 'Sitemap: http://localhost:3000/sitemap.xml' /tmp/frontend-robots.txt
          if grep --fixed-strings 'runtime-override.invalid' /tmp/frontend-robots.txt; then
            echo 'Public configuration must stay bound to the built image'
            exit 1
          fi

  ci-status:
    name: All CI Checks Passed
    needs:
      - codegen-check
      - tools-tests
      - backend-lint
      - backend-unit-tests
      - backend-integration-tests
      - frontend-checks
      - frontend-docker-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          echo "Codegen: ${{ needs.codegen-check.result }}"
          echo "Repository Tool Tests: ${{ needs.tools-tests.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Checks: ${{ needs.frontend-checks.result }}"
          echo "Frontend Docker Build: ${{ needs.frontend-docker-build.result }}"

          if [[ "${{ needs.codegen-check.result }}" != "success" || \
                "${{ needs.tools-tests.result }}" != "success" || \
                "${{ needs.backend-lint.result }}" != "success" || \
                "${{ needs.backend-unit-tests.result }}" != "success" || \
                "${{ needs.backend-integration-tests.result }}" != "success" || \
                "${{ needs.frontend-checks.result }}" != "success" || \
                "${{ needs.frontend-docker-build.result }}" != "success" ]]; then
            echo "ERROR: One or more CI checks failed!"
            exit 1
          fi
          echo "All CI checks completed successfully!"
