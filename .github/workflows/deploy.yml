name: Deploy Template

# Promotes images that PR CI already built and tested, then deploys them to k3s with
# Helm; it runs no tests and builds nothing. A new environment needs
# deploy/<environment>/ (gate.yaml, gate-infra.yaml), a GitHub environment with the
# secrets in deploy/README.md, and a caller workflow.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name; selects deploy/<environment>/ and the GitHub environment'
        required: true
        type: string
      release:
        description: 'Commit to deploy; a previous release redeploys (rolls back to) its images'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: Promote Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release }}
          fetch-depth: 0

      # Only merged code is deployed, also when a run is started by hand.
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI names images by their sources (see ci.yml). The release tag names the
      # commit; a release that already has it is reused. If CI images were cleaned
      # up (unreleased for 30 days), run CI on main and deploy again.
      - name: Tag tested images as the release
        id: release
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          tag="release-$commit"
          backend="ghcr.io/brawler2011/gate-backend:$(git rev-parse 'HEAD^{tree}')"
          judge="$(go run ./tools/judgeimage)"
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          # promote <tested image>: tags that exact manifest as the release of this commit.
          promote() {
            release="${1%:*}:$tag"
            if ! tested="$(digest "$1" 2> /dev/null)"; then
              if docker buildx imagetools inspect "$release" > /dev/null 2>&1; then
                echo "$release already exists."
                return
              fi
              echo "::error::$1 was not built by CI for commit $commit; deploy builds nothing."
              exit 1
            fi
            # Copy the manifest as is; the default would wrap it in a new index.
            docker buildx imagetools create --prefer-index=false --tag "$release" "$1"
            if [ "$(digest "$release")" != "$tested" ]; then
              echo "::error::$release does not have the tested digest $tested."
              exit 1
            fi
            echo "$release = $tested"
          }
          promote "$backend"
          promote "$judge"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: promote
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      NAMESPACE: gate
      KUBECONFIG: ${{ github.workspace }}/.kubeconfig
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release }}

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: helm kubectl

      # The API listens only on the server; an SSH tunnel reaches it without opening
      # a port. HostKeyAlias pins the server key whatever form SSH_HOST takes.
      - name: Connect to the cluster
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o HostKeyAlias=gate-server -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 \
            -fN -L 6443:127.0.0.1:6443 "$SSH_USER@$SSH_HOST"
          printf '%s' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
          kubectl version

      # Cluster bootstrap (Traefik, trusted proxy) and the secrets both charts read.
      # See deploy/README.md for what each secret holds.
      - name: Apply cluster configuration and secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail
          kubectl apply -f deploy/k3s/
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          deploy/secrets.sh kubectl -n "$NAMESPACE"
          # The cluster pulls images long after this job ends, so it needs its own token.
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr --dry-run=client -o yaml \
            --docker-server="$REGISTRY" --docker-username=${{ github.repository_owner }} \
            --docker-password="$GHCR_PULL_TOKEN" | kubectl apply -f -

      - name: Deploy data services
        run: >-
          helm upgrade --install gate-infra deploy/charts/gate-infra
          --namespace "$NAMESPACE" -f deploy/${{ inputs.environment }}/gate-infra.yaml
          --wait --timeout 10m

      # Migrations run first as a hook; if they or the new pods fail, Helm restores
      # the previous release and the job fails. The previous pods serve throughout.
      # The timeout covers pulling the multi-GB judge image on a small server.
      - name: Deploy the release
        run: >-
          helm upgrade --install gate deploy/charts/gate
          --namespace "$NAMESPACE" -f deploy/${{ inputs.environment }}/gate.yaml
          --set-file backend.config=deploy/${{ inputs.environment }}/config.yaml
          --set imageTag=${{ needs.promote.outputs.tag }}
          --rollback-on-failure --timeout 20m

      # The cluster checks readiness from inside; this catches routing, certificate
      # and DNS problems that only show from outside.
      - name: Check the public endpoint
        run: |
          host="$(helm --namespace "$NAMESPACE" get values gate -o json | jq -r .ingress.host)"
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$host/health"

      - name: Show the release state
        if: always()
        run: |
          helm --namespace "$NAMESPACE" history gate --max 5 || true
          kubectl --namespace "$NAMESPACE" get pods || true
