name: Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment tag (e.g. dev, prod)'
        required: true
        type: string
      domain_name:
        description: 'Domain name for frontend configuration'
        required: true
        type: string
      deploy_dir:
        description: 'Target directory on VPS'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Run CI Checks
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-backend
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
      NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_WEBSOCKET_URL: ${{ vars.NEXT_PUBLIC_WEBSOCKET_URL }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate frontend build configuration
        run: |
          : "${BACKEND_API_URL:?Set the BACKEND_API_URL environment variable in GitHub}"
          : "${NEXT_PUBLIC_BACKEND_API_URL:?Set the NEXT_PUBLIC_BACKEND_API_URL environment variable in GitHub}"
          : "${NEXT_PUBLIC_APP_URL:?Set the NEXT_PUBLIC_APP_URL environment variable in GitHub}"
          : "${NEXT_PUBLIC_WEBSOCKET_URL:?Set the NEXT_PUBLIC_WEBSOCKET_URL environment variable in GitHub}"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-frontend
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BACKEND_API_URL=${{ env.NEXT_PUBLIC_BACKEND_API_URL }}
            BACKEND_API_URL=${{ env.BACKEND_API_URL }}
            NEXT_PUBLIC_WEBSOCKET_URL=${{ env.NEXT_PUBLIC_WEBSOCKET_URL }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-judge:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Judge
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-go-judge
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Judge image
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/common/judge
          file: ./deploy/common/judge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend, build-judge]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy common configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/common/**"
          strip_components: 2
          target: "~/gate/deploy/common"
          overwrite: true

      - name: Copy environment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/${{ inputs.environment }}/**"
          strip_components: 2
          target: "${{ inputs.deploy_dir }}/.incoming"
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          IMAGE_TAG: ${{ inputs.environment }}
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_APP_DB: ${{ secrets.POSTGRES_APP_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB_INDEX: ${{ secrets.REDIS_DB_INDEX }}
          NATS_HOST: ${{ secrets.NATS_HOST }}
          NATS_PORT: ${{ secrets.NATS_PORT }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          STORAGE_TYPE: ${{ secrets.STORAGE_TYPE }}
          BACKEND_ADDRESS: ${{ secrets.BACKEND_ADDRESS }}
          BACKEND_PRIVATE_ADDRESS: ${{ secrets.BACKEND_PRIVATE_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || secrets.EMAIL_FROM }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.APP_BASE_URL || format('https://{0}', inputs.domain_name) }}
          ENV: ${{ inputs.environment }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,DOMAIN_NAME,IMAGE_TAG,BACKEND_API_URL,ENV,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_APP_DB,POSTGRES_HOST,POSTGRES_PORT,REDIS_PASSWORD,REDIS_HOST,REDIS_PORT,REDIS_DB_INDEX,NATS_HOST,NATS_PORT,S3_ENDPOINT,S3_ACCESS_KEY,S3_SECRET_KEY,STORAGE_TYPE,BACKEND_ADDRESS,BACKEND_PRIVATE_ADDRESS,RESEND_API_KEY,EMAIL_FROM,APP_BASE_URL
          script: |
            set -eu
            cd '${{ inputs.deploy_dir }}'
            python3 ~/gate/deploy/common/rollout.py capture --health-url "https://${DOMAIN_NAME}/health"
            cp -R .incoming/. .
            if [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
              cat <<EOF > s3.json
            {
              "identities": [
                {
                  "name": "gate_admin",
                  "credentials": [
                    {
                      "accessKey": "$S3_ACCESS_KEY",
                      "secretKey": "$S3_SECRET_KEY"
                    }
                  ],
                  "actions": [
                    "Admin",
                    "Read",
                    "List",
                    "Tagging",
                    "Write"
                  ]
                }
              ]
            }
            EOF
            fi
            echo "$GITHUB_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            python3 ~/gate/deploy/common/rollout.py deploy --health-url "https://${DOMAIN_NAME}/health"
