name: Deploy Template

# Promotes images that PR CI already built and tested; it runs no tests and builds
# nothing. A new environment needs deploy/<environment>/ (docker-compose.yml,
# config.yaml), a GitHub environment with its secrets, and a caller workflow.
on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment name; selects deploy/<environment>/ and the GitHub environment'
        required: true
        type: string
      domain_name:
        description: 'Public domain of the environment'
        required: true
        type: string
      deploy_dir:
        description: 'Target directory on VPS'
        required: true
        type: string
      release:
        description: 'Commit to deploy; a previous release redeploys (rolls back to) its images'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  promote:
    name: Promote Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release }}

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          version: "2026.10.25"
          install_args: go

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CI names images by their sources (see ci.yml). The release tag names the
      # commit; a release that already has it is reused.
      - name: Tag tested images as the release
        id: release
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          tag="release-$commit"
          # promote <tested image>: tags it as the release of this commit.
          promote() {
            release="${1%:*}:$tag"
            if docker buildx imagetools inspect "$release" > /dev/null 2>&1; then
              echo "$release already exists."
            elif docker buildx imagetools inspect "$1" > /dev/null 2>&1; then
              docker buildx imagetools create --tag "$release" "$1"
            else
              echo "::error::$1 was not built by CI for commit $commit; deploy builds nothing."
              exit 1
            fi
          }
          promote "$REGISTRY/${OWNER,,}/gate-backend:$(git rev-parse 'HEAD^{tree}')"
          promote "$(go run ./tools/judgeimage)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

  deploy:
    name: Deploy
    needs: promote
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release }}

      - name: Copy environment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/${{ inputs.environment }}/**"
          strip_components: 2
          target: "${{ inputs.deploy_dir }}"
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          RELEASE_TAG: ${{ needs.promote.outputs.tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,DOMAIN_NAME,RELEASE_TAG,POSTGRES_PASSWORD,REDIS_PASSWORD,S3_ACCESS_KEY,S3_SECRET_KEY,RESEND_API_KEY
          script: |
            set -eu
            cd ${{ inputs.deploy_dir }}
            # Every setting comes from config.yaml or the variables above.
            rm -f .env
            if [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
              cat <<EOF > s3.json
            {
              "identities": [
                {
                  "name": "gate_admin",
                  "credentials": [
                    {
                      "accessKey": "$S3_ACCESS_KEY",
                      "secretKey": "$S3_SECRET_KEY"
                    }
                  ],
                  "actions": [
                    "Admin",
                    "Read",
                    "List",
                    "Tagging",
                    "Write"
                  ]
                }
              ]
            }
            EOF
            fi
            echo "$GITHUB_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            echo "Deploying $RELEASE_TAG"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Waiting for services to become healthy..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -kfsS "https://${DOMAIN_NAME}/health" > /dev/null 2>&1; then
                echo "Healthcheck passed! https://${DOMAIN_NAME}/health is responding."
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: Healthcheck timed out for https://${DOMAIN_NAME}/health!"
              docker compose ps
              exit 1
            fi
