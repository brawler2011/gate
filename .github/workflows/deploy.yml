name: Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment tag (e.g. dev, prod)'
        required: true
        type: string
      domain_name:
        description: 'Domain name for frontend configuration'
        required: true
        type: string
      deploy_dir:
        description: 'Target directory on VPS'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Run CI Checks
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-backend
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-frontend
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL || format('https://{0}', inputs.domain_name) }}
            NEXT_PUBLIC_BACKEND_API_URL=${{ vars.NEXT_PUBLIC_BACKEND_API_URL || secrets.NEXT_PUBLIC_BACKEND_API_URL || '/api' }}
            BACKEND_API_URL=${{ vars.BACKEND_API_URL || secrets.BACKEND_API_URL || format('http://gate-backend-{0}:8080', inputs.environment) }}
            NEXT_PUBLIC_WEBSOCKET_URL=${{ vars.NEXT_PUBLIC_WEBSOCKET_URL || secrets.NEXT_PUBLIC_WEBSOCKET_URL || format('wss://{0}/ws', inputs.domain_name) }}
            NEXT_PUBLIC_OTEL_SERVICE_NAME=${{ vars.NEXT_PUBLIC_OTEL_SERVICE_NAME || secrets.NEXT_PUBLIC_OTEL_SERVICE_NAME || 'gate-frontend-browser' }}
            NEXT_PUBLIC_OTEL_EXPORTER_URL=${{ vars.NEXT_PUBLIC_OTEL_EXPORTER_URL || secrets.NEXT_PUBLIC_OTEL_EXPORTER_URL || format('https://{0}/otlp/v1/traces', inputs.domain_name) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-judge:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Judge
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-go-judge
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Judge image
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/common/judge
          file: ./deploy/common/judge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-frontend, build-judge]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy common configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/common/**"
          strip_components: 2
          target: "~/gate/deploy/common"
          overwrite: true

      - name: Copy environment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/${{ inputs.environment }}/**"
          strip_components: 2
          target: "${{ inputs.deploy_dir }}"
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          IMAGE_TAG: ${{ inputs.environment }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_APP_DB: ${{ secrets.POSTGRES_APP_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          REDIS_DB_INDEX: ${{ secrets.REDIS_DB_INDEX }}
          NATS_HOST: ${{ secrets.NATS_HOST }}
          NATS_PORT: ${{ secrets.NATS_PORT }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          STORAGE_TYPE: ${{ secrets.STORAGE_TYPE }}
          BACKEND_ADDRESS: ${{ secrets.BACKEND_ADDRESS }}
          BACKEND_PRIVATE_ADDRESS: ${{ secrets.BACKEND_PRIVATE_ADDRESS }}
          BACKEND_OTEL_ENDPOINT: ${{ secrets.BACKEND_OTEL_ENDPOINT }}
          BACKEND_OTEL_SERVICE_NAME: ${{ secrets.BACKEND_OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,DOMAIN_NAME,IMAGE_TAG,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_APP_DB,POSTGRES_HOST,POSTGRES_PORT,REDIS_PASSWORD,REDIS_HOST,REDIS_PORT,REDIS_DB_INDEX,NATS_HOST,NATS_PORT,S3_ENDPOINT,S3_ACCESS_KEY,S3_SECRET_KEY,STORAGE_TYPE,BACKEND_ADDRESS,BACKEND_PRIVATE_ADDRESS,BACKEND_OTEL_ENDPOINT,BACKEND_OTEL_SERVICE_NAME,OTEL_EXPORTER_OTLP_ENDPOINT,OTEL_SERVICE_NAME,GRAFANA_ADMIN_PASSWORD
          script: |
            cd ${{ inputs.deploy_dir }}
            echo "$GITHUB_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull --ignore-buildable
            docker compose up -d --remove-orphans
            docker image prune -f
