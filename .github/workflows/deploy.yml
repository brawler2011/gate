name: Deploy Template

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment tag (e.g. dev, prod)'
        required: true
        type: string
      domain_name:
        description: 'Domain name for frontend configuration'
        required: true
        type: string
      deploy_dir:
        description: 'Target directory on VPS'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Run CI Checks
    permissions:
      contents: read
      actions: write
      packages: write
    uses: ./.github/workflows/ci.yml

  build-backend:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-backend
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-judge:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Extract Docker metadata for Judge
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/gate-go-judge
          tags: |
            type=raw,value=${{ inputs.environment }}

      - name: Build and push Judge image
        uses: docker/build-push-action@v7
        with:
          context: ./judge
          file: ./judge/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-backend, build-judge]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Copy environment configuration to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/${{ inputs.environment }}/**"
          strip_components: 2
          target: "${{ inputs.deploy_dir }}"
          overwrite: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          IMAGE_TAG: ${{ inputs.environment }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_TOKEN,DOMAIN_NAME,IMAGE_TAG,POSTGRES_PASSWORD,REDIS_PASSWORD,S3_ACCESS_KEY,S3_SECRET_KEY,RESEND_API_KEY
          script: |
            set -eu
            cd ${{ inputs.deploy_dir }}
            # Every setting comes from config.yaml or the variables above.
            rm -f .env
            if [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
              cat <<EOF > s3.json
            {
              "identities": [
                {
                  "name": "gate_admin",
                  "credentials": [
                    {
                      "accessKey": "$S3_ACCESS_KEY",
                      "secretKey": "$S3_SECRET_KEY"
                    }
                  ],
                  "actions": [
                    "Admin",
                    "Read",
                    "List",
                    "Tagging",
                    "Write"
                  ]
                }
              ]
            }
            EOF
            fi
            echo "$GITHUB_TOKEN" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose pull --ignore-buildable
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Waiting for services to become healthy..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -kfsS "https://${DOMAIN_NAME}/health" > /dev/null 2>&1; then
                echo "Healthcheck passed! https://${DOMAIN_NAME}/health is responding."
                HEALTHY=1
                break
              fi
              sleep 2
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: Healthcheck timed out for https://${DOMAIN_NAME}/health!"
              docker compose ps
              exit 1
            fi
