name: Set up Go job
description: Install project tools and cache each Go job's modules and build artifacts
inputs:
  tools:
    description: Space-separated mise tools (empty installs all)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-tools
      with:
        tools: ${{ inputs.tools }}
    - uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ github.job }}-${{ hashFiles('mise.toml', '**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ github.job }}-
