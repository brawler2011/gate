name: Technical task
description: Engineering work without a user-visible feature
labels: [technical-task]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing now, and why it matters.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
      description: What should be true afterwards.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Constraints, open design questions, out of scope.
