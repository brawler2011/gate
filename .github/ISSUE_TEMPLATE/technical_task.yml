name: Technical task
description: Define scoped engineering work and verifiable outcomes
labels: [technical-task]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the current behavior, problem, and relevant constraints.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the desired result and scope. Include unresolved design questions when relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a Markdown checklist of observable, testable outcomes.
      placeholder: "- [ ] A specific result is verified by a named check or scenario."
    validations:
      required: true
