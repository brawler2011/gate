name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and why.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired result
      description: What should work afterwards, from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Constraints, open questions, out of scope.
