name: Bug report
description: Report incorrect behavior in Gate
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps or observed scenario. Include version and environment details only when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened. Include logs and links only when they help explain the problem; remove secrets.
    validations:
      required: true
