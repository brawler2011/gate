# The language catalog: every compiler and interpreter configuration that
# submissions and problem programs can select, by its identifier (the table name).
# Identifiers are stored with submissions and problem components; keep them stable.
#
# name        what people see: the compiler or interpreter variant and version
# extensions  source file extensions; the first names new files, and an extension
#             suggests the first configuration (in file order) that accepts it
# syntax      Prism (refractor) grammar the frontend highlights sources with
# package     nixpkgs attribute installed into the judge image (see flake.nix)
# The other keys tell the backend how to compile and run code in the sandbox,
# where the runtime's binaries are available under /usr/bin.

[c]
name = "C (GCC 15)"
extensions = ["c"]
syntax = "c"
package = "gcc15"
type = "compiler"
code_file = "foo.c"
compile = "/usr/bin/gcc -O2 -Wall -std=gnu23 -o ${name} foo.c -lm"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp17]
name = "C++17 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=c++17 -o ${name} foo.cc"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp20]
name = "C++20 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=c++20 -o ${name} foo.cc"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp23]
name = "C++23 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=c++23 -o ${name} foo.cc"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp26]
name = "C++26 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=c++26 -o ${name} foo.cc"
compile_file = "solution"
execute = "${dir}/${name}"

[python3]
name = "Python 3.14 (CPython)"
extensions = ["py"]
syntax = "python"
package = "python314"
type = "interpreter"
code_file = "foo.py"
execute = "/usr/bin/python3 ${dir}/foo.py"

[pypy3]
name = "Python 3.11 (PyPy 7.3)"
extensions = ["py"]
syntax = "python"
package = "pypy3"
type = "interpreter"
code_file = "foo.py"
execute = "/usr/bin/pypy3 ${dir}/foo.py"

[go]
name = "Go 1.26"
extensions = ["go"]
syntax = "go"
package = "go_1_26"
type = "compiler"
code_file = "foo.go"
compile = "/usr/bin/go build -o ${name} foo.go"
compile_file = "solution"
execute = "${dir}/${name}"

[java]
name = "Java 25 (OpenJDK)"
extensions = ["java"]
syntax = "java"
package = "jdk25_headless"
type = "compiler"
code_file = "Main.java"
compile = "/usr/bin/javac Main.java"
compile_file = "Main.class"
execute = "/usr/bin/java -Xmx192m -Xms32m -XX:ActiveProcessorCount=1 -cp ${dir} Main"

[rust]
name = "Rust 1.95"
extensions = ["rs"]
syntax = "rust"
package = "rustc"
type = "compiler"
code_file = "foo.rs"
compile = "/usr/bin/rustc -O --edition 2024 -o ${name} foo.rs"
compile_file = "solution"
execute = "${dir}/${name}"

[node]
name = "JavaScript (Node.js 24)"
extensions = ["js"]
syntax = "javascript"
package = "nodejs-slim_24"
type = "interpreter"
code_file = "foo.js"
execute = "/usr/bin/node ${dir}/foo.js"
