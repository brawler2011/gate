# Identifiers are persisted with submissions and problem components; keep them stable.
# Catalog order sets extension suggestion priority; put preferred configurations first.

[c]
name = "C (GCC 15)"
extensions = ["c"]
syntax = "c"
package = "gcc15"
type = "compiler"
code_file = "foo.c"
compile = "/usr/bin/gcc -O2 -Wall -std=gnu23 -o ${name} foo.c ${graders} -lm"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp23]
name = "C++23 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=gnu++23 -o ${name} foo.cc ${graders}"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp20]
name = "C++20 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=gnu++20 -o ${name} foo.cc ${graders}"
compile_file = "solution"
execute = "${dir}/${name}"

[cpp17]
name = "C++17 (GCC 15)"
extensions = ["cpp", "cc", "cxx"]
syntax = "cpp"
package = "gcc15"
type = "compiler"
code_file = "foo.cc"
compile = "/usr/bin/g++ -O2 -Wall -std=gnu++17 -o ${name} foo.cc ${graders}"
compile_file = "solution"
execute = "${dir}/${name}"

[python3]
name = "Python 3.14 (CPython)"
extensions = ["py"]
syntax = "python"
package = "python314"
type = "interpreter"
code_file = "foo.py"
execute = "/usr/bin/python3 ${dir}/foo.py"

[python3.graders]
code_file = "${solution}.py"
entry = "grader.py"

[pypy3]
name = "Python 3.11 (PyPy 7.3)"
extensions = ["py"]
syntax = "python"
package = "pypy3"
type = "interpreter"
code_file = "foo.py"
execute = "/usr/bin/pypy3 ${dir}/foo.py"

[pypy3.graders]
code_file = "${solution}.py"
entry = "grader.py"

[go]
name = "Go 1.26"
extensions = ["go"]
syntax = "go"
package = "go_1_26"
type = "compiler"
code_file = "foo.go"
compile = "/usr/bin/go build -o ${name} foo.go"
compile_file = "solution"
execute = "${dir}/${name}"

[java]
name = "Java 25 (OpenJDK)"
extensions = ["java"]
syntax = "java"
package = "jdk25_headless"
type = "compiler"
code_file = "${class}.java"
compile = "/usr/bin/javac-jar ${name} ${class} ${class}.java"
compile_file = "Main.jar"
execute = "/usr/bin/java -Xmx192m -Xms32m -Xss64m -XX:ActiveProcessorCount=1 -jar ${dir}/Main.jar"

[java.graders]
code_file = "${solution}.java"
compile = "/usr/bin/javac-jar ${name} grader ${solution}.java ${graders}"
entry = "grader.java"

[rust]
name = "Rust 1.95 (2024 edition)"
extensions = ["rs"]
syntax = "rust"
package = "rustc"
type = "compiler"
code_file = "foo.rs"
compile = "/usr/bin/rustc -O --edition 2024 -o ${name} foo.rs"
compile_file = "solution"
execute = "${dir}/${name}"

[rust2021]
name = "Rust 1.95 (2021 edition)"
extensions = ["rs"]
syntax = "rust"
package = "rustc"
type = "compiler"
code_file = "foo.rs"
compile = "/usr/bin/rustc -O --edition 2021 -o ${name} foo.rs"
compile_file = "solution"
execute = "${dir}/${name}"

[node]
name = "JavaScript (Node.js 24)"
extensions = ["js"]
syntax = "javascript"
package = "nodejs-slim_24"
type = "interpreter"
code_file = "foo.js"
execute = "/usr/bin/node ${dir}/foo.js"


[kotlin]
name = "Kotlin 2.3"
extensions = ["kt"]
syntax = "kotlin"
package = "kotlin"
variant = "full"
type = "compiler"
code_file = "foo.kt"
compile = "/usr/bin/kotlinc -J-XX:ActiveProcessorCount=1 -nowarn -include-runtime -d ${name} foo.kt"
compile_file = "Main.jar"
execute = "/usr/bin/java -Xmx192m -Xms32m -Xss64m -XX:ActiveProcessorCount=1 -jar ${dir}/Main.jar"

[scala]
name = "Scala 3.3"
extensions = ["scala"]
syntax = "scala"
package = "scala_3"
variant = "full"
type = "compiler"
code_file = "foo.scala"
compile = "/usr/bin/scala-jar ${name} foo.scala"
compile_file = "Main.jar"
execute = "/usr/bin/java -Xmx192m -Xms32m -Xss64m -XX:ActiveProcessorCount=1 -jar ${dir}/Main.jar"

[csharp]
name = "C# 14 (.NET 10)"
extensions = ["cs"]
syntax = "csharp"
package = "dotnet-sdk_10"
variant = "full"
type = "compiler"
code_file = "foo.cs"
compile = "/usr/bin/csc-dll ${name} foo.cs"
compile_file = "solution.dll"
execute = "/usr/bin/dotnet-dll ${dir}/solution.dll"

[d]
name = "D (LDC 1.41)"
extensions = ["d"]
syntax = "d"
package = "ldc"
variant = "full"
type = "compiler"
code_file = "foo.d"
compile = "/usr/bin/ldc2 -O -release -of=${name} foo.d"
compile_file = "solution"
execute = "${dir}/${name}"

[pascal]
name = "Free Pascal 3.2 (Delphi mode)"
extensions = ["pas", "dpr"]
syntax = "pascal"
package = "fpc"
variant = "full"
type = "compiler"
code_file = "foo.pas"
compile = "/usr/bin/fpc -Mdelphi -O2 -XS -o${name} foo.pas"
compile_file = "solution"
execute = "${dir}/${name}"

[haskell]
