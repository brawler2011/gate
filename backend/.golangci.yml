run:
  timeout: 5m

linters:
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - forbidigo
    - gci
    - gocritic
    - gosec
    - govet
    - ineffassign
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - testifylint
    - tparallel
    - unparam
    - unused
    - wrapcheck

linters-settings:
  forbidigo:
    forbid:
      - p: '^fmt\.Print.*$'
        msg: "Do not use fmt.Print*, use slog instead."
      - p: '^log\.(Print|Fatal|Panic).*$'
        msg: "Do not use log package, use slog instead."
  wrapcheck:
    ignoreSigs:
      - .Errorf(
      - errors.New(
      - errors.Unwrap(
      - errors.Join(
      - .Wrap(
      - .Wrapf(
      - HandleContextErr(
      - .Err()
      - .Write(
      - .Encode(
      - .Parse(
    ignorePackageGlobs:
      - github.com/brawler2011/gate/backend/*
  revive:
    rules:
      - name: var-naming
        disabled: true

issues:
  exclude-dirs:
    - contracts
    - tests/mocks
  exclude-files:
    - ".*\\.pb\\.go$"
