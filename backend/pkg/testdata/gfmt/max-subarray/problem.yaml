format_version: "2.0"
title: "Maximum Subarray Sum"
type: "standard"
grading: "pass-fail"

limits:
  time_ms: 1000
  memory_mb: 256

system_library:
  - testlib.h

testset:
  groups:
    - name: samples
      tests:
        - input: "01.in"
          sample: true
        - input: "02.in"
          sample: true
    - name: secret
      requires: [samples]
      tests:
        - generate: "generator 10 100"
        - generate: "generator 100 1000"
        - generate: "generator 1000 10000"
        - generate: "generator 10000 100000"
        - generate: "generator 100000 1000000"

solutions:
  ok.cpp: "OK"
  ok.py: "OK"
  ok.go: "OK"
  wa.cpp: "WA"
  wa.py: "WA"
  wa.go: "WA"
