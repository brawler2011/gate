format_version: "2.0"
title: "A+B"
type: "standard"
grading: "pass-fail"

limits:
  time_ms: 1000
  memory_mb: 256

system_library:
  - testlib.h

testset:
  groups:
    - name: samples
      tests:
        - input: "01.in"
          sample: true
        - input: "02.in"
          sample: true
        - input: "03.in"
          sample: true
    - name: secret
      requires: [samples]
      tests:
        - generate: "echo 10 20"
        - generate: "echo -50 50"
        - generate: "echo -100 100"
        - generate: "echo 0 0"
        - generate: "echo -7 -99"
        - generate: "echo 100 100"

solutions:
  ok.cpp: "OK"
  ok.py: "OK"
  ok.go: "OK"
  ok.java: "OK"
  wa.py: "WA"
  wa.go: "WA"
  ce.cpp: "CE"
  tl.cpp: "TLE"
  ml.cpp: "MLE"
  re.cpp: "RE"
