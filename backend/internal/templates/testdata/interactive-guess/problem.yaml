format_version: "2.0"
title: "Interactive Guessing"
type: "interactive"

limits:
  time_ms: 2000
  memory_mb: 256

system_library:
  - testlib.h

testset:
  groups:
    - name: samples
      tests:
        - input: "01.in"
          sample: true
    - name: secret
      requires: [samples]
      tests:
        - input: "02.in"

solutions:
  ok.cpp: "OK"
  ok.py: "OK"
  ok.go: "OK"
  wa.cpp: "WA"
  wa.py: "WA"
  wa.go: "WA"
