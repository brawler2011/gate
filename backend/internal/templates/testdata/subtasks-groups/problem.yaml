format_version: "2.0"
title: "Even or Odd Subtasks"
type: "scoring"

limits:
  time_ms: 1000
  memory_mb: 256

system_library:
  - testlib.h

testset:
  groups:
    - name: even_subtask
      aggregate: min
      tests:
        - input: "01.in"
          points: 40
    - name: odd_subtask
      aggregate: min
      tests:
        - input: "02.in"
          points: 60

solutions:
  ok.cpp: "OK"
  ok.py: "OK"
  wa.cpp: "WA"
  wa.py: "WA"
