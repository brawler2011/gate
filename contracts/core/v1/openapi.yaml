openapi: 3.0.3
info:
  description: Core service API for programming problems, contests, and submissions.
  title: CoreService API
  version: 0.0.1
servers:
  - url: /api
    description: Core API base path
tags:
- name: auth
  description: Authentication and account recovery.
- name: users
  description: User profiles, settings, and administrative actions.
- name: problems
  description: Problem authoring, packages, and workshop files.
- name: contests
  description: Contests, membership, submissions, and scoreboards.
- name: organizations
  description: Organizations, members, invitations, and join requests.
- name: teams
  description: Teams and their shared resources.
- name: invitations
  description: Named invitations and join links for organizations, teams, and contests.
- name: posts
  description: Blog posts and preview images.
- name: submissions
  description: Submission processing and test results.
- name: notifications
  description: User notifications and unread counts.
- name: system
  description: Service health and supported languages.

paths:
  /problems/{id}/draft:
    get:
      tags:
      - problems
      operationId: GetProblemDraft
      summary: Read the editable problem draft
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
    put:
      tags:
      - problems
      operationId: SaveProblemDraft
      summary: Replace the draft in one revision change
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDraft'
  /problems/{id}/packages/build:
    post:
      tags:
      - problems
      operationId: BuildProblemPackage
      summary: Queue an immutable draft snapshot
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemBuildAccepted'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              properties:
                expected_revision:
                  type: integer
                  format: int64
  /problems/{id}/builds:
    get:
      tags:
      - problems
      operationId: ListProblemBuilds
      summary: List the latest 100 builds
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProblemBuild'
  /problems/{id}/builds/{buildId}:
    get:
      tags:
      - problems
      operationId: GetProblemBuild
      summary: Read build progress and diagnostics
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/BuildIDPath'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemBuild'
    patch:
      tags: [problems]
      operationId: CancelProblemBuild
      summary: Cancel a queued or running build
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
        - $ref: "#/components/parameters/BuildIDPath"
      requestBody:
        description: "Request payload for cancel problem build."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelProblemBuildRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemBuildCancelled"
  /problems/{id}/draft/uploads:
    post:
      tags:
      - problems
      operationId: UploadProblemDraft
      summary: Upload immutable test files or a statement resource
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/ExpectedRevisionQuery'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - metadata
              properties:
                metadata:
                  type: string
                  maxLength: 65536
                  description: 'JSON with exactly one entry to add or replace: asset_name,
                    test, checker_test, or validator (a name) with validator_test. The
                    files fill its slots and must include at least one: asset for an
                    asset; input and answer for a test (input only when manual, answer
                    only when provided); input, output and answer for a checker test;
                    input for a validator test. Slots without a file keep the entry''s
                    object IDs.'
                asset:
                  type: string
                  format: binary
                input:
                  type: string
                  format: binary
                output:
                  type: string
                  format: binary
                answer:
                  type: string
                  format: binary
  /problems/{id}/draft/objects/{objectId}:
    get:
      tags:
      - problems
      operationId: GetProblemDraftObject
      summary: Download a binary referenced by this draft
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - name: objectId
        in: path
        required: true
        description: Referenced stored object.
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /problems/{id}/draft/export:
    get:
      tags:
      - problems
      operationId: ExportProblemDraft
      summary: Download the draft as a Gate author package
      description: The archive imports back through ImportProblem.
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        default:
          $ref: "#/components/responses/Problem"
        '200':
          description: Draft archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /languages:
    get:
      tags: [system]
      operationId: GetLanguages
      summary: Get supported programming languages
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedLanguagesResponse"
  /lib:
    get:
      tags: [system]
      operationId: GetSystemLibrary
      summary: Get the system library files
      description: The files auto-updated library files of problem drafts build with, such as testlib.h.
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLibrary"
  /problems:
    get:
      summary: "List problems"
      tags: [problems]
      operationId: ListProblems
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: search
          description: "Search text used to filter results."
          in: query
          schema:
            type: string
          example: Fibonacci
        - name: descending
          description: "Whether to sort results in descending order."
          in: query
          schema:
            type: boolean
            default: true
        - name: owner
          description: "When true, return only problems owned by the current user."
          in: query
          schema:
            type: boolean
          example: true
        - $ref: "#/components/parameters/OrganizationIDQuery"
        - name: is_template
          description: "Filter problems by whether they are templates."
          in: query
          schema:
            type: boolean
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProblemsResponseModel"
    post:
      summary: "Create problem"
      tags: [problems]
      operationId: CreateProblem
      parameters:
        - name: title
          description: "Title of the new problem."
          in: query
          required: true
          schema:
            type: string
          example: Problem 1
        - $ref: "#/components/parameters/OrganizationIDQuery"
        - name: template_id
          description: "Built-in template (builtin: prefix) or the ID of a readable problem in the same organization to fork."
          in: query
          required: true
          schema:
            type: string
          example: builtin:a-plus-b
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseModel"
  /problem-templates:
    get:
      summary: "List problem templates"
      tags: [problems]
      operationId: ListProblemTemplates
      parameters:
        - $ref: "#/components/parameters/OrganizationIDQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemTemplateModel"
  /problems/{id}:
    get:
      summary: "Get problem"
      tags: [problems]
      operationId: GetProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProblemResponseModel"
    delete:
      summary: "Delete problem"
      tags: [problems]
      operationId: DeleteProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
    patch:
      summary: "Update problem"
      tags: [problems]
      operationId: UpdateProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        description: "Request payload for update problem."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProblemRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
  /contests:
    get:
      summary: "List contests"
      description: "Contests visible to the caller; administrators see all."
      tags: [contests]
      operationId: ListContests
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
        - $ref: "#/components/parameters/OrganizationIDQuery"
        - name: team_id
          description: "Only contests the team is registered in."
          in: query
          schema:
            type: string
            format: uuid
        - name: visibility
          description: "Visibility level of the resource."
          in: query
          schema:
            type: string
            enum:
              - public
              - private
        - $ref: "#/components/parameters/SortByQuery"
        - $ref: "#/components/parameters/ContestSortOrderQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestsResponseModel"
    post:
      summary: "Create contest"
      tags: [contests]
      operationId: CreateContest
      requestBody:
        description: "Request payload for create contest."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContestRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseModel"
  /admin/users/{username}/change-email:
    post:
      tags: [system]
      operationId: AdminChangeEmail
      summary: Change user email as admin (direct or with confirmation)
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      requestBody:
        description: "Request payload for admin change email."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangeEmailRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
  /admin/users/{username}/set-password:
    post:
      tags: [system]
      operationId: AdminSetPassword
      summary: Set user password directly as admin
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      requestBody:
        description: "Request payload for admin set password."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetPasswordRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
  /admin/users/{username}/send-reset-password:
    post:
      tags: [system]
      operationId: AdminSendPasswordReset
      summary: Send password reset link to user email
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
  /admin/users/{username}/resend-verification:
    post:
      tags: [system]
      operationId: AdminResendVerification
      summary: Resend email verification link for user
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content: {}
  /organizations/{org_login}/contests/{contest_login}:
    get:
      summary: "Get contest"
      tags: [contests]
      operationId: GetContest
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContestResponseModel"
  /contests/{contest_id}:
    delete:
      summary: "Delete contest"
      tags: [contests]
      operationId: DeleteContest
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
    patch:
      summary: "Update contest"
      tags: [contests]
      operationId: UpdateContest
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      requestBody:
        description: "Request payload for update contest."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContestRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
  /contests/{contest_id}/booklets:
    get:
      tags: [contests]
      operationId: ListContestBooklets
      summary: List contest booklets, one per statement language
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestBooklets"
  /contests/{contest_id}/statements.pdf:
    get:
      tags: [contests]
      operationId: DownloadContestStatementsPdf
      summary: Download the stored PDF booklet with contest statements
      description: Answers booklet_not_ready while the booklet is being built and booklet_failed when it does not compile.
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - name: lang
          description: "Statement language of the booklet."
          in: query
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: PDF booklet containing contest problem statements
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /contests/{contest_id}/problems:
    post:
      summary: "Create contest problem"
      tags: [contests]
      operationId: CreateContestProblem
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/ProblemIDQuery"
        - name: package_id
          description: "UUID of the problem package."
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "204":
          description: No Content
  /contests/{contest_id}/problems/reorder:
    put:
      summary: "Reorder contest problems"
      tags: [contests]
      operationId: ReorderContestProblems
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      requestBody:
        description: "Request payload for reorder contest problems."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderContestProblemsRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
  /contests/{contest_id}/problems/{problem_id}:
    get:
      summary: "Get contest problem"
      tags: [contests]
      operationId: GetContestProblem
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContestProblemResponseModel"
    delete:
      summary: "Delete contest problem"
      tags: [contests]
      operationId: DeleteContestProblem
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
  /contests/{contest_id}/problems/{problem_id}/assets/{sha256}:
    get:
      summary: "Get a contest problem statement image"
      description: "Serves a statement image of the problem package the contest currently uses, addressed by content hash, so the response never changes."
      tags: [contests]
      operationId: GetContestProblemAsset
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
        - name: sha256
          description: "SHA-256 of the image, as listed in the problem's `assets`."
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: Statement image from the problem package used by the contest
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
  /contests/{contest_id}/members:
    get:
      summary: "List contest members"
      tags: [contests]
      operationId: ListContestMembers
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestMembersResponseModel"
    delete:
      summary: "Delete contest member"
      tags: [contests]
      operationId: DeleteContestMember
      parameters:
        - $ref: "#/components/parameters/UserIDQuery"
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
    patch:
      summary: "Update contest member"
      tags: [contests]
      operationId: UpdateContestMember
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/UserIDQuery"
        - $ref: "#/components/parameters/ContestRoleQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
  /contests/{contest_id}/invitations:
    get:
      summary: "List pending contest invitations"
      tags: [invitations]
      operationId: ListContestInvitations
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInvitationsResponseModel"
    post:
      summary: "Invite a user to take part in the contest"
      tags: [invitations]
      operationId: InviteContestParticipant
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      requestBody:
        description: "The user to invite."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteContestParticipantRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationModel"
  /contests/{contest_id}/join-link:
    get:
      summary: "Get the contest join link"
      tags: [invitations]
      operationId: GetContestJoinLink
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinLinkModel"
    put:
      summary: "Turn on the contest join link with a new token"
      tags: [invitations]
      operationId: ResetContestJoinLink
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinLinkModel"
    delete:
      summary: "Turn off the contest join link"
      tags: [invitations]
      operationId: DisableContestJoinLink
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "204":
          description: No Content
  /contests/{contest_id}/teams:
    get:
      summary: "List contest teams"
      tags: [contests]
      operationId: ListContestTeams
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestTeamsResponseModel"
    post:
      summary: "Create contest team"
      tags: [contests]
      operationId: CreateContestTeam
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/TeamIDQuery"
        - name: role
          description: "Role to assign to the member."
          in: query
          required: false
          schema:
            type: string
            enum: [moderator, participant]
            default: participant
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
    delete:
      summary: "Delete contest team"
      tags: [contests]
      operationId: DeleteContestTeam
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/TeamIDQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
    patch:
      summary: "Update contest team"
      tags: [contests]
      operationId: UpdateContestTeam
      parameters:
        - $ref: "#/components/parameters/ContestIDPath"
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/ContestTeamRoleQuery"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: OK
  /contests/{contest_id}/submissions:
    get:
      summary: "List contest submissions"
      tags: [contests]
      operationId: ListContestSubmissions
      parameters:
