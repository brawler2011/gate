components:
  responses:
    VerifyEmailResponse:
      description: Successfully verified email
      headers:
        Set-Cookie:
          description: Session cookie
          required: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponseModel"

  securitySchemes:
    cookieAuth:
      description: Authenticate using the session_id cookie issued at login.
      type: apiKey
      in: cookie
      name: session_id

  parameters:
    ExpectedRevisionQuery:
      name: expected_revision
      in: query
      required: true
      description: Revision last read by the author. A different current revision returns 409.
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable identifier for retries of exactly this request.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    BuildIDPath:
      name: buildId
      in: path
      required: true
      description: Build identifier.
      schema:
        type: string
        format: uuid
    PageQuery:
      name: page
      in: query
      description: "Page number"
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1

    PageSizeQuery:
      name: pageSize
      in: query
      description: "Number of items per page"
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 100

    OrganizationIDQuery:
      name: organization_id
      description: UUID of the organization.
      in: query
      schema:
        type: string
        format: uuid
    ProblemIDPath:
      name: id
      description: UUID of the problem.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContestSearchQuery:
      name: search
      description: Search text used to filter results.
      in: query
      schema:
        type: string
      example: Contest
    SortByQuery:
      name: sortBy
      description: Field used to sort results.
      in: query
      schema:
        type: string
        enum:
        - created_at
        - updated_at
        - title
      example: created_at
    ContestSortOrderQuery:
      name: sortOrder
      description: 'Sort direction: asc or desc.'
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
      example: desc
    UsernamePath:
      name: username
      description: Username of the user.
      in: path
      required: true
      schema:
        type: string
      example: user123
    OrgLoginPath:
      name: org_login
      description: Organization login.
      in: path
      required: true
      schema:
        type: string
    ContestLoginPath:
      name: contest_login
      description: Contest login within the organization.
      in: path
      required: true
      schema:
