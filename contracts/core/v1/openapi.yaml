          enum:
          - checker
          - validator
          - interactor
          - generator
          - solution
        path:
          type: string
        language:
          type: string
        dependencies:
          type: object
          additionalProperties:
            type: string
    ProblemDraftSubtask:
      type: object
      required:
      - id
      - ordinal
      - name
      - points
      - policy
      - depends_on
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          format: int64
        name:
          type: string
        points:
          type: number
          format: double
        policy:
          type: string
          enum:
          - complete
          - each
        depends_on:
          type: array
          items:
            type: string
            format: uuid
    ProblemDraftTest:
      type: object
      required:
      - points
      - id
      - ordinal
      - subtask_id
      - sample
      - input
      - answer
      properties:
        points:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          multipleOf: 0.01
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          format: int64
        subtask_id:
          type: string
          format: uuid
        sample:
          type: boolean
        input:
          $ref: '#/components/schemas/ProblemDraftInput'
        answer:
          $ref: '#/components/schemas/ProblemDraftAnswer'
