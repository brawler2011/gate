    post:
      summary: "Confirm email change"
      tags: [auth]
      operationId: ConfirmEmailChange
      requestBody:
        description: "Request payload for confirm email change."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailChangeRequestModel"
      responses:
        default:
          $ref: "#/components/responses/Problem"
        "200":
          description: Email change confirmed successfully
          content: {}
components:
  responses:
    Problem:
      description: Error.
      headers:
        Retry-After:
          description: Seconds to wait before retrying; sent with 429.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VerifyEmailResponse:
      description: Successfully verified email
      headers:
        Set-Cookie:
          description: Session cookie
          required: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponseModel"

  securitySchemes:
    cookieAuth:
      description: Authenticate using the session_id cookie issued at login.
      type: apiKey
      in: cookie
