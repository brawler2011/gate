        page_size: 50
        total_items: 101
        total_pages: 3
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          description: Requested page number, including when beyond the last page.
          type: integer
          format: int32
          minimum: 1
        page_size:
          description: Effective maximum number of items per page.
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        total_items:
          description: Number of matching items visible to the caller across all pages.
          type: integer
          format: int32
          minimum: 0
