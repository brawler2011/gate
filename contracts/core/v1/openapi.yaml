        type: string
        format: uuid

  schemas:
    ProblemDraftInput:
      type: object
      required:
      - mode
      - object_id
      - generator
      - args
      properties:
        mode:
          type: string
          enum:
          - manual
          - generator
        object_id:
          type: string
          format: uuid
          nullable: true
        generator:
          type: string
          description: Name of a generator of the draft.
          nullable: true
        args:
          type: array
          items:
            type: string
    ProblemDraftAnswer:
      type: object
      required:
      - mode
      - object_id
      - solution
      properties:
        mode:
          type: string
          enum:
          - provided
          - generated
          - interactive
        object_id:
          type: string
          format: uuid
          nullable: true
        solution:
          type: string
          description: Name of a solution of the draft.
          nullable: true
    ProblemDraftProgram:
      description: A source in a language configuration. The checker, interactor, validators and generators compile with the whole draft library, each file under its name; solutions compile alone.
      type: object
      required:
      - language
      - source
      properties:
        language:
          type: string
          description: Identifier of the language configuration from GET /languages, such as cpp17 or python3.
        source:
          type: string
    ProblemDraftChecker:
      description: The checker. A standard checker (standard is set) has an empty source; every build takes its current version from GET /lib with the system testlib.h, compiled in the C++ configuration language.
      type: object
      required:
      - language
      - source
      - standard
      - tests
      properties:
        language:
          type: string
          description: Identifier of the language configuration from GET /languages, such as cpp17 or python3.
        source:
          type: string
        standard:
          type: string
          description: Name of a standard checker from GET /lib, such as wcmp, or empty for the author's own source.
        tests:
          type: array
          description: Run by every build after compiling the checker; a test whose verdict or points differ fails the build.
          items:
            $ref: '#/components/schemas/ProblemDraftCheckerTest'
    ProblemDraftCheckerTest:
      type: object
      required:
      - id
      - input
      - output
      - answer
      - verdict
      - points
      properties:
        id:
          type: string
          format: uuid
        input:
          type: string
          format: uuid
          description: Stored object IDs of the files, uploaded through /draft/uploads.
        output:
          type: string
          format: uuid
          description: The contestant output to check.
        answer:
          type: string
          format: uuid
        verdict:
          type: string
          enum:
          - OK
          - WA
          - PE
          - FAIL
          - POINTS
        points:
          type: number
          format: double
          nullable: true
          description: Points the checker must give with the POINTS verdict; null accepts any.
    ProblemDraftValidatorTest:
      type: object
      required:
      - id
      - input
      - valid
      - group
      properties:
        id:
          type: string
          format: uuid
        input:
          type: string
          format: uuid
          description: Stored object ID of the input, uploaded through /draft/uploads.
        valid:
          type: boolean
          description: Whether the validator must accept the input.
        group:
          type: string
          description: Passed to the validator as --group unless empty.
    ProblemBuildProgramTest:
      description: What a build saw on a checker or validator test.
      type: object
      required:
      - id
      - verdict
      - points
      - mismatch
      properties:
        id:
          type: string
          format: uuid
          description: ID of the checker or validator test.
        verdict:
          type: string
          description: The checker verdict, or valid or invalid for a validator.
        points:
          type: number
          format: double
          nullable: true
        mismatch:
          type: string
          description: How the result misses the expectation; empty when it matches.
    ProblemDraftNamedProgram:
      description: A generator; tests refer to it by name.
      type: object
      required:
      - name
      - language
      - source
      properties:
        name:
          type: string
          description: Unique among the programs of its role; the program's package file is the name with the extension of its language.
        language:
          type: string
          description: Identifier of the language configuration from GET /languages, such as cpp17 or python3.
        source:
          type: string
    ProblemDraftSolution:
      description: A solution; the build judges it on every test unless verdicts is empty.
      type: object
      required:
      - name
      - language
      - source
      - verdicts
      - points
      properties:
        name:
          type: string
          description: Unique among the solutions; the program's package file is the name with the extension of its language.
        language:
          type: string
          description: Identifier of the language configuration from GET /languages, such as cpp17 or python3.
        source:
          type: string
        verdicts:
          type: array
          description: Verdicts allowed on a test besides OK; unless OK is listed, some test must get one of them, and CE expects a compilation error. Empty keeps the solution out of the build.
          items:
            $ref: '#/components/schemas/ProblemSolutionVerdict'
        points:
          type: number
          format: double
          nullable: true
          description: Score a solution of a scoring problem must get.
    ProblemSolutionVerdict:
      type: string
      enum:
      - OK
      - WA
      - PE
      - TLE
      - MLE
      - OLE
      - RE
      - FAIL
      - POINTS
      - CE
    ProblemBuildSolution:
      description: What a build saw of a solution.
      type: object
      required:
      - name
      - verdict
      - test
      - time_ms
      - points
      - mismatch
      properties:
        name:
          type: string
        verdict:
          $ref: '#/components/schemas/ProblemSolutionVerdict'
        test:
          type: integer
          format: int64
          nullable: true
          description: Ordinal of the first test whose verdict is not OK.
        time_ms:
          type: integer
          format: int64
          description: Longest CPU time over the tests.
        points:
          type: number
          format: double
          nullable: true
        mismatch:
          type: string
          description: How the result misses the expected verdicts or points; empty when it matches.
    ProblemDraftValidator:
      description: A validator; the build fails when it rejects a test input. testlib validators receive --group with the subtask name.
      type: object
      required:
      - name
      - language
      - source
      - subtasks
      - tests
      properties:
        name:
          type: string
          description: Unique among the validators; the program's package file is the name with the extension of its language.
        language:
          type: string
          description: Identifier of the language configuration from GET /languages, such as cpp17 or python3.
        source:
          type: string
        subtasks:
          type: array
          description: IDs of the subtasks whose tests the validator checks; empty checks every test.
          items:
            type: string
            format: uuid
        tests:
          type: array
          description: Run by every build after compiling the validator; a test it judges differently fails the build.
          items:
            $ref: '#/components/schemas/ProblemDraftValidatorTest'
    ProblemDraftLibraryFile:
      description: A source file judge programs include by its name; names are unique in a draft and identify the file.
      type: object
      required:
      - name
      - content
      - auto_update
      properties:
        name:
          type: string
        content:
          type: string
          description: Empty for an auto-updated file.
        auto_update:
          type: boolean
          description: The file is the system library file of its name from GET /lib, whose current text every build takes. Only an empty file named after a system library file can be auto-updated.
    ProblemDraftStatement:
      description: The statement in one language as Markdown sections.
      type: object
      required:
      - language
      - title
      - legend
      - input
      - output
      - notes
      - interaction
      - scoring
      properties:
        language:
          type: string
        title:
          type: string
          maxLength: 1024
          description: Shown with this statement instead of the problem title; empty shows the problem title.
        legend:
          type: string
        input:
          type: string
        output:
          type: string
        notes:
          type: string
        interaction:
          type: string
        scoring:
          type: string
    ProblemDraftSubtask:
      type: object
      required:
      - id
      - ordinal
      - name
      - points
      - policy
      - feedback
      - depends_on
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          format: int64
        name:
          type: string
        points:
          type: number
          format: double
        policy:
          type: string
          enum:
          - complete
          - each
        feedback:
          description: "What participants see of the group while the contest runs: every test, tests up to the first failure, the group's points, or nothing."
          type: string
          enum:
          - complete
          - icpc
          - points
          - none
        depends_on:
          type: array
          items:
            type: string
            format: uuid
    ProblemDraftTest:
      type: object
      required:
      - points
      - id
      - ordinal
      - subtask_id
      - sample
      - pretest
      - input
      - answer
      properties:
        points:
          type: number
          format: double
          minimum: 0
          maximum: 1000000000
          multipleOf: 0.01
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          format: int64
        subtask_id:
          type: string
          format: uuid
        sample:
          type: boolean
        pretest:
          description: Contests with pretests judge their submissions on these tests until the end.
          type: boolean
        input:
          $ref: '#/components/schemas/ProblemDraftInput'
        answer:
          $ref: '#/components/schemas/ProblemDraftAnswer'
    ProblemDraftAsset:
      description: A statement resource; sections show it as ![alt](name).
      type: object
      required:
      - name
      - object_id
      properties:
        name:
          type: string
        object_id:
          type: string
          format: uuid
    ProblemDraft:
      description: >-
        The editable problem as typed entries without package paths. Programs
        are referred to by their names, unique within a role, and library
        files are included by their names; subtasks and tests are referred to
        by ID.
      type: object
      required:
      - problem_id
      - revision
      - title
      - short_name
      - type
      - time_limit_ms
      - memory_limit_mb
      - max_score
      - checker
      - interactor
      - validators
      - generators
      - solutions
      - main_solution
      - input_file
      - output_file
      - library
      - statements
      - assets
      - subtasks
      - tests
      properties:
        problem_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        title:
          type: string
        short_name:
          type: string
        type:
          type: string
          enum:
          - pass-fail
          - scoring
          - interactive
        time_limit_ms:
          type: integer
          format: int64
        memory_limit_mb:
          type: integer
          format: int64
        max_score:
          type: number
          format: double
          nullable: true
        checker:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ProblemDraftChecker'
        interactor:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/ProblemDraftProgram'
        validators:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftValidator'
        generators:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftNamedProgram'
        solutions:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftSolution'
        main_solution:
          type: string
          description: Name of a solution of the draft.
          nullable: true
        input_file:
          type: string
          description: File the solution reads instead of standard input; empty for standard input.
        output_file:
          type: string
          description: File the solution writes instead of standard output; empty for standard output.
        library:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftLibraryFile'
        statements:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftStatement'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftAsset'
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftSubtask'
        tests:
          type: array
          items:
            $ref: '#/components/schemas/ProblemDraftTest'
    ProblemPackage:
      type: object
      required: [id, problem_id, build_id, revision, package_hash, created_at]
      properties:
        id:
          type: string
          format: uuid
        problem_id:
          type: string
          format: uuid
        build_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        package_hash:
          type: string
          description: Full SHA-256 of the archive.
        created_at:
          type: string
          format: date-time
    ProblemBuild:
      type: object
      required:
      - id
      - problem_id
      - organization_id
      - revision
      - state
      - attempt
      - max_attempts
      - deadline
      - created_at
      - finished_at
      - diagnostic
      - solutions
      - program_tests
      properties:
        id:
          type: string
          format: uuid
        problem_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        attempt:
          type: integer
          format: int64
        max_attempts:
          type: integer
          format: int64
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        diagnostic:
          type: object
          nullable: true
          additionalProperties: true
        solutions:
          type: array
          nullable: true
          description: Results of the solutions that run, once every test is built.
          items:
            $ref: '#/components/schemas/ProblemBuildSolution'
        program_tests:
          type: array
          nullable: true
          description: Results of the checker and validator tests, once their programs compile.
          items:
            $ref: '#/components/schemas/ProblemBuildProgramTest'
    ProblemBuildAccepted:
      type: object
      required:
      - build_id
      - revision
      properties:
        build_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
    ProblemBuildCancelled:
      type: object
      required:
      - build_id
      - state
      properties:
        build_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - cancelled
    Problem:
      description: RFC 9457 problem details. Clients branch and translate on `code` and `params`; `detail` is English text for debugging.
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: post not found
        code:
          $ref: "#/components/schemas/ErrorCode"
        params:
          type: object
          additionalProperties: true
        request_id:
          type: string
          example: 123e4567-e89b-42d3-a456-426614174000
        errors:
          description: Invalid values of the request body.
          type: array
          items:
            $ref: "#/components/schemas/FieldProblem"
    FieldProblem:
      description: One invalid value of a request body.
      type: object
      required: [pointer, code]
      properties:
        pointer:
          description: RFC 6901 JSON Pointer into the request body; a query parameter is /<name>.
          type: string
          example: /tests/3/input/generator
        code:
          $ref: "#/components/schemas/ErrorCode"
        params:
          type: object
          additionalProperties: true
        detail:
          type: string
    ErrorCode:
      type: string
      enum:
        - invalid
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - payload_too_large
        - rate_limited
        - internal
        - not_implemented
        - concurrent_update
        - in_use
        - already_member
        - request_pending
        - username_taken
        - email_taken
        - organization_login_taken
        - contest_login_taken
        - team_slug_taken
        - problem_short_name_taken
        - problem_in_contest
        - email_not_verified
        - wrong_password
        - invitation_pending
        - request_resolved
        - invite_only
        - not_org_member
        - link_invalid
        - account_expired
