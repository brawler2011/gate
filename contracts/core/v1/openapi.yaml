          enum:
          - manual
          - generator
        object_id:
          type: string
          format: uuid
          nullable: true
        component_id:
          type: string
          format: uuid
          nullable: true
        args:
          type: array
          items:
            type: string
        seed:
          type: integer
          format: int64
          nullable: true
    ProblemDraftAnswer:
      type: object
      required:
      - mode
      - object_id
      - component_id
      properties:
        mode:
          type: string
          enum:
          - provided
          - generated
          - interactive
        object_id:
          type: string
          format: uuid
          nullable: true
        component_id:
          type: string
          format: uuid
          nullable: true
    ProblemDraftComponent:
      type: object
      required:
      - id
      - role
      - path
      - language
      - dependencies
      properties:
        id:
          type: string
          format: uuid
        role:
