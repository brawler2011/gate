components:
  responses:
    VerifyEmailResponse:
      description: Successfully verified email
      headers:
        Set-Cookie:
          description: Session cookie
          required: false
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponseModel"

  securitySchemes:
    cookieAuth:
      description: Authenticate using the session_id cookie issued at login.
      type: apiKey
      in: cookie
      name: session_id

  parameters:
    PageQuery:
      name: page
      in: query
      description: "Page number"
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1

    PageSizeQuery:
      name: pageSize
      in: query
      description: "Number of items per page"
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 100

    OrganizationIDQuery:
      name: organization_id
      description: UUID of the organization.
      in: query
      schema:
        type: string
        format: uuid
    ProblemIDPath:
      name: id
      description: UUID of the problem.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContestSearchQuery:
      name: search
      description: Search text used to filter results.
      in: query
      schema:
        type: string
      example: Contest
    SortByQuery:
      name: sortBy
      description: Field used to sort results.
      in: query
      schema:
        type: string
        enum:
        - created_at
        - updated_at
        - title
      example: created_at
    ContestSortOrderQuery:
      name: sortOrder
      description: 'Sort direction: asc or desc.'
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
      example: desc
    UsernamePath:
      name: username
      description: Username of the user.
      in: path
      required: true
      schema:
        type: string
      example: user123
    OrgLoginPath:
      name: org_login
      description: Organization login.
      in: path
      required: true
      schema:
        type: string
    ContestLoginPath:
      name: contest_login
      description: Contest login within the organization.
      in: path
      required: true
      schema:
        type: string
    ProblemIDQuery:
      name: problem_id
      description: UUID of the problem.
      in: query
      required: true
      schema:
        type: string
        format: uuid
    ProblemIDPathBySnakeName:
      name: problem_id
      description: UUID of the problem.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIDQuery:
      name: user_id
      description: UUID of the user.
      in: query
      required: true
      schema:
        type: string
        format: uuid
    RoleQuery:
      name: role
      description: Role to assign to the member.
      in: query
      required: true
      schema:
        type: string
    TeamIDQuery:
      name: team_id
      description: UUID of the team.
      in: query
      required: true
      schema:
        type: string
        format: uuid
    OptionalUserIDQuery:
      name: userId
      description: UUID of the user.
      in: query
      schema:
        type: string
        format: uuid
    OptionalProblemIDQuery:
      name: problemId
      description: UUID of the problem.
      in: query
      schema:
        type: string
        format: uuid
    StateQuery:
      name: state
      description: Filter results by processing state.
      in: query
      schema:
        type: integer
        format: int32
      example: 1
    SubmissionSortOrderQuery:
      name: sortOrder
      description: 'Sort direction: asc or desc.'
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
      example: asc
    LanguageQuery:
      name: language
      description: Programming language identifier.
      in: query
      schema:
        type: integer
        format: int32
      example: 1
    SubmissionIDPath:
      name: submission_id
      description: UUID of the submission.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: user_id
      description: UUID of the user.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JoinRequestIDPath:
      name: id
      description: UUID of the join request.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContestIDQuery:
      name: contestId
      description: UUID of the contest.
      in: query
      schema:
        type: string
        format: uuid
    IfNoneMatchHeader:
      name: If-None-Match
      description: Previously returned ETag; returns 304 when the image has not changed.
      in: header
      required: false
      schema:
        type: string
    ProblemIDPathByCamelName:
      name: problemId
      description: UUID of the problem.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LangQuery:
      name: lang
      description: Language code of the problem statement.
      in: query
      required: false
      schema:
        type: string
    NameQuery:
      name: name
      description: Name of the workshop file.
      in: query
      required: true
      schema:
        type: string
    NamePath:
      name: name
      description: Name of the workshop file.
      in: path
      required: true
      schema:
        type: string
    SearchQuery:
      name: search
      description: Search text used to filter results.
      in: query
      schema:
        type: string
    OrganizationLoginPath:
      name: login
      description: Organization login.
      in: path
      required: true
      schema:
        type: string
    InvitationIDPath:
      name: id
      description: UUID of the invitation.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamIDPath:
      name: id
      description: UUID of the team.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostIDPath:
      name: id
      description: UUID of the post.
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      description: "Error data."
      example:
        error: Resource not found
      type: object
      properties:
        error:
          example: Resource not found
          type: string
    CreationResponseModel:
      description: "Result of creation."
      example:
        id: 123e4567-e89b-42d3-a456-426614174000
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
    UpdateUserRequestModel:
      description: "Fields for the update user request."
      example:
        username: alice
        role: user
        email: user@example.com
      type: object
      properties:
        username:
          type: string
        role:
          type: string
          enum:
            - user
            - admin
        email:
          type: string
    PaginationModel:
      description: "Pagination data."
      example:
        page: 1
        total: 10
      type: object
      required:
        - page
        - total
      properties:
        page:
          type: integer
          format: int32
          example: 1
        total:
          type: integer
          format: int32
          example: 10
    ProblemSampleModel:
      description: "Problem sample data."
      example:
        input: 1 2
        output: '3'
      type: object
      required:
        - input
        - output
      properties:
        input:
          type: string
        output:
          type: string
    ProblemTemplateModel:
      description: "Problem template data."
      example:
        id: builtin:a-plus-b
        title: Стандартная задача (A+B)
        description: Классическая задача со стандартным вводом-выводом, чекером на testlib.h и валидатором тестов
        problem_type: pass-fail
        is_builtin: false
      type: object
      required:
        - id
        - title
        - description
        - problem_type
        - is_builtin
      properties:
        id:
          type: string
          example: builtin:a-plus-b
        title:
          type: string
          example: Стандартная задача (A+B)
        description:
          type: string
          example: Классическая задача со стандартным вводом-выводом, чекером на testlib.h и валидатором тестов
        problem_type:
          type: string
          example: pass-fail
        is_builtin:
          type: boolean
    ProblemModel:
