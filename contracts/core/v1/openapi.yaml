openapi: 3.0.3
info:
  description: Core service API for programming problems, contests, and submissions.
  title: CoreService API
  version: 0.0.1
servers:
  - url: /api
    description: Core API base path
tags:
- name: auth
  description: Authentication and account recovery.
- name: users
  description: User profiles, settings, and administrative actions.
- name: problems
  description: Problem authoring, packages, and workshop files.
- name: contests
  description: Contests, membership, submissions, and scoreboards.
- name: organizations
  description: Organizations, members, invitations, and join requests.
- name: teams
  description: Teams and their shared resources.
- name: posts
  description: Blog posts and preview images.
- name: submissions
  description: Submission processing and test results.
- name: notifications
  description: User notifications and unread counts.
- name: system
  description: Service health and supported languages.

paths:
  /problems/{id}/draft:
    get:
      tags:
      - problems
      operationId: GetProblemDraft
      summary: Read the editable problem draft
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
    put:
      tags:
      - problems
      operationId: SaveProblemDraft
      summary: Replace the draft in one revision change
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/ExpectedRevisionQuery'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProblemDraft'
  /problems/{id}/packages/build:
    post:
      tags:
      - problems
      operationId: BuildProblemPackage
      summary: Queue an immutable draft snapshot
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemBuildAccepted'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              properties:
                expected_revision:
                  type: integer
                  format: int64
  /problems/{id}/builds:
    get:
      tags:
      - problems
      operationId: ListProblemBuilds
      summary: List the latest 100 builds
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProblemBuild'
  /problems/{id}/builds/{buildId}:
    get:
      tags:
      - problems
      operationId: GetProblemBuild
      summary: Read build progress and diagnostics
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/BuildIDPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemBuild'
  /problems/{id}/builds/{buildId}/cancel:
    post:
      tags:
      - problems
      operationId: CancelProblemBuild
      summary: Cancel a queued or running build
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/BuildIDPath'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemBuildCancelled'
  /problems/{id}/draft/uploads:
    post:
      tags:
      - problems
      operationId: UploadProblemDraft
      summary: Upload immutable test bodies or a resource
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - $ref: '#/components/parameters/ExpectedRevisionQuery'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDraft'
      requestBody:
        required: true
        description: Revision-safe draft operation.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - metadata
              - file
              properties:
                metadata:
                  type: string
                  maxLength: 65536
                  description: 'JSON UploadChange: part (asset/input/answer/pair), asset_path
                    or full test metadata. For pair, file is the input and answer is
                    the answer.'
                file:
                  type: string
                  format: binary
                answer:
                  type: string
                  format: binary
  /problems/{id}/draft/objects/{objectId}:
    get:
      tags:
      - problems
      operationId: GetProblemDraftObject
      summary: Download a binary referenced by this draft
      parameters:
      - $ref: '#/components/parameters/ProblemIDPath'
      - name: objectId
        in: path
        required: true
        description: Referenced stored object.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /languages:
    get:
      tags: [system]
      operationId: GetLanguages
      summary: Get supported programming languages
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportedLanguagesResponse"
  /problems:
    get:
      summary: "List problems"
      tags: [problems]
      operationId: ListProblems
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - name: search
          description: "Search text used to filter results."
          in: query
          schema:
            type: string
          example: Fibonacci
        - name: descending
          description: "Whether to sort results in descending order."
          in: query
          schema:
            type: boolean
            default: true
        - name: owner
          description: "When true, return only problems owned by the current user."
          in: query
          schema:
            type: boolean
          example: true
        - $ref: "#/components/parameters/OrganizationIDQuery"
        - name: is_template
          description: "Filter problems by whether they are templates."
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProblemsResponseModel"
    post:
      summary: "Create problem"
      tags: [problems]
      operationId: CreateProblem
      parameters:
        - name: title
          description: "Title of the new problem."
          in: query
          required: true
          schema:
            type: string
          example: Problem 1
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: "#/components/parameters/OrganizationIDQuery"
        - name: template_id
          description: "Problem template identifier, including the builtin: prefix for built-in templates."
          in: query
          required: true
          schema:
            type: string
          example: builtin:a-plus-b
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseModel"
  /problem-templates:
    get:
      summary: "List problem templates"
      tags: [problems]
      operationId: ListProblemTemplates
      parameters:
        - $ref: "#/components/parameters/OrganizationIDQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemTemplateModel"
  /problems/{id}:
    get:
      summary: "Get problem"
      tags: [problems]
      operationId: GetProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetProblemResponseModel"
    delete:
      summary: "Delete problem"
      tags: [problems]
      operationId: DeleteProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "200":
          description: OK
          content: {}
    patch:
      summary: "Update problem"
      tags: [problems]
      operationId: UpdateProblem
      parameters:
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        description: "Request payload for update problem."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProblemRequestModel"
      responses:
        "200":
          description: OK
          content: {}
  /admin/contests:
    get:
      summary: "List admin contests"
      tags: [contests]
      operationId: ListAdminContests
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
        - name: visibility
          description: "Visibility level of the resource."
          in: query
          schema:
            type: string
            enum:
              - public
              - private
        - $ref: "#/components/parameters/SortByQuery"
        - $ref: "#/components/parameters/ContestSortOrderQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestsResponseModel"
  /admin/users/{username}/change-email:
    post:
      tags: [system]
      operationId: AdminChangeEmail
      summary: Change user email as admin (direct or with confirmation)
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      requestBody:
        description: "Request payload for admin change email."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangeEmailRequestModel"
      responses:
        "200":
          description: OK
          content: {}
  /admin/users/{username}/set-password:
    post:
      tags: [system]
      operationId: AdminSetPassword
      summary: Set user password directly as admin
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      requestBody:
        description: "Request payload for admin set password."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSetPasswordRequestModel"
      responses:
        "200":
          description: OK
          content: {}
  /admin/users/{username}/send-reset-password:
    post:
      tags: [system]
      operationId: AdminSendPasswordReset
      summary: Send password reset link to user email
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      responses:
        "200":
          description: OK
          content: {}
  /admin/users/{username}/resend-verification:
    post:
      tags: [system]
      operationId: AdminResendVerification
      summary: Resend email verification link for user
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
      responses:
        "200":
          description: OK
          content: {}
  /users/{username}/contests:
    get:
      summary: "List user contests"
      tags: [contests]
      operationId: ListUserContests
      parameters:
        - $ref: "#/components/parameters/UsernamePath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
        - name: sortBy
          description: "Field used to sort results."
          in: query
          schema:
            type: string
            enum:
              - last_submission_time
              - created_at
              - updated_at
              - title
          example: last_submission_time
        - $ref: "#/components/parameters/ContestSortOrderQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListUserContestsResponseModel"
  /workshop/contests:
    get:
      summary: "List workshop contests"
      tags: [contests]
      operationId: ListWorkshopContests
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
        - $ref: "#/components/parameters/SortByQuery"
        - $ref: "#/components/parameters/ContestSortOrderQuery"
        - $ref: "#/components/parameters/OrganizationIDQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestsResponseModel"
  /public/contests:
    get:
      summary: "List public contests"
      tags: [contests]
      operationId: ListPublicContests
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
        - $ref: "#/components/parameters/SortByQuery"
        - $ref: "#/components/parameters/ContestSortOrderQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestsResponseModel"
  /organizations/{org_login}/contests:
    post:
      summary: "Create contest"
      tags: [contests]
      operationId: CreateContest
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - name: title
          description: "Title of the new contest."
          in: query
          required: true
          schema:
            type: string
          example: Contest 1
        - name: login
          description: "Login of the new contest within the organization."
          in: query
          required: false
          schema:
            type: string
          example: contest-1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreationResponseModel"
    get:
      summary: "List organization contests"
      tags: [contests]
      operationId: ListOrganizationContests
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/ContestSearchQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestsResponseModel"
  /organizations/{org_login}/contests/{contest_login}:
    get:
      summary: "Get contest"
      tags: [contests]
      operationId: GetContest
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContestResponseModel"
    delete:
      summary: "Delete contest"
      tags: [contests]
      operationId: DeleteContest
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        "200":
          description: OK
    patch:
      summary: "Update contest"
      tags: [contests]
      operationId: UpdateContest
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      requestBody:
        description: "Request payload for update contest."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContestRequestModel"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/statements.pdf:
    get:
      tags: [contests]
      operationId: DownloadContestStatementsPdf
      summary: Download PDF booklet with contest statements
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - name: lang
          description: "Language code of the problem statement."
          in: query
          schema:
            type: string
            default: ru
      responses:
        "200":
          description: PDF booklet containing contest problem statements
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /organizations/{org_login}/contests/{contest_login}/problems:
    post:
      summary: "Create contest problem"
      tags: [contests]
      operationId: CreateContestProblem
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/ProblemIDQuery"
        - name: package_id
          description: "UUID of the problem package."
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
  /organizations/{org_login}/contests/{contest_login}/problems/reorder:
    put:
      summary: "Reorder contest problems"
      tags: [contests]
      operationId: ReorderContestProblems
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      requestBody:
        description: "Request payload for reorder contest problems."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderContestProblemsRequestModel"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/problems/{problem_id}:
    get:
      summary: "Get contest problem"
      tags: [contests]
      operationId: GetContestProblem
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContestProblemResponseModel"
    delete:
      summary: "Delete contest problem"
      tags: [contests]
      operationId: DeleteContestProblem
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/members:
    get:
      summary: "List contest members"
      tags: [contests]
      operationId: ListContestMembers
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestMembersResponseModel"
    post:
      summary: "Create contest member"
      tags: [contests]
      operationId: CreateContestMember
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/UserIDQuery"
      responses:
        "204":
          description: No Content
    delete:
      summary: "Delete contest member"
      tags: [contests]
      operationId: DeleteContestMember
      parameters:
        - $ref: "#/components/parameters/UserIDQuery"
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        "200":
          description: OK
    patch:
      summary: "Update contest member"
      tags: [contests]
      operationId: UpdateContestMember
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/UserIDQuery"
        - $ref: "#/components/parameters/ContestRoleQuery"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/teams:
    get:
      summary: "List contest teams"
      tags: [contests]
      operationId: ListContestTeams
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListContestTeamsResponseModel"
    post:
      summary: "Create contest team"
      tags: [contests]
      operationId: CreateContestTeam
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/TeamIDQuery"
        - name: role
          description: "Role to assign to the member."
          in: query
          required: false
          schema:
            type: string
            enum: [moderator, participant]
            default: participant
      responses:
        "200":
          description: OK
    delete:
      summary: "Delete contest team"
      tags: [contests]
      operationId: DeleteContestTeam
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/TeamIDQuery"
      responses:
        "200":
          description: OK
    patch:
      summary: "Update contest team"
      tags: [contests]
      operationId: UpdateContestTeam
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/TeamIDQuery"
        - $ref: "#/components/parameters/ContestTeamRoleQuery"
      responses:
        "200":
          description: OK

  /organizations/{org_login}/contests/{contest_login}/my-role:
    get:
      summary: "Get my contest role"
      tags: [contests]
      operationId: GetMyContestRole
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMyContestRoleResponseModel"
  /organizations/{org_login}/contests/{contest_login}/submissions:
    get:
      summary: "List contest submissions"
      tags: [contests]
      operationId: ListContestSubmissions
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
        - $ref: "#/components/parameters/OptionalUserIDQuery"
        - $ref: "#/components/parameters/OptionalProblemIDQuery"
        - $ref: "#/components/parameters/StateQuery"
        - $ref: "#/components/parameters/SubmissionSortOrderQuery"
        - $ref: "#/components/parameters/LanguageQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSubmissionsResponseModel"
  /organizations/{org_login}/contests/{contest_login}/submissions/{submission_id}/rejudge:
    post:
      summary: "Rejudge submission"
      tags: [contests]
      operationId: RejudgeSubmission
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/SubmissionIDPath"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/submissions/{submission_id}/block:
    post:
      summary: "Block submission"
      tags: [contests]
      operationId: BlockSubmission
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/SubmissionIDPath"
      requestBody:
        description: "Request payload for block submission."
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockSubmissionRequestModel"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/submissions/{submission_id}/unblock:
    post:
      summary: "Unblock submission"
      tags: [contests]
      operationId: UnblockSubmission
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/SubmissionIDPath"
      responses:
        "200":
          description: OK
  /organizations/{org_login}/contests/{contest_login}/participants/{user_id}/problems/{problem_id}/block:
    post:
      summary: "Block problem for user"
      tags: [contests]
      operationId: BlockProblemForUser
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
        - $ref: "#/components/parameters/ContestLoginPath"
        - $ref: "#/components/parameters/UserIDPath"
        - $ref: "#/components/parameters/ProblemIDPathBySnakeName"
      requestBody:
        description: "Request payload for block problem for user."
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockProblemRequestModel"
      responses:
        "200":
          description: OK
    delete:
      summary: "Unblock problem for user"
      tags: [contests]
      operationId: UnblockProblemForUser
      parameters:
        - $ref: "#/components/parameters/OrgLoginPath"
