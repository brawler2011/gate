pre-commit:
  parallel: true
  commands:
    backend-lint:
      glob: "backend/**/*.{go,sql}"
      run: task lint:be
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: task lint:fe

commit-msg:
  commands:
    validate-commit-msg:
      run: task validate:commit -- --edit "{1}"
