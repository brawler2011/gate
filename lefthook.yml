pre-commit:
  parallel: true
  commands:
    backend-lint:
      glob: "backend/**/*.{go,sql}"
      run: mise exec -- task lint:be
    frontend-lint:
      glob: "frontend/**/*.{ts,tsx,js,jsx}"
      run: mise exec -- task lint:fe

commit-msg:
  commands:
    validate-commit-msg:
      run: mise exec -- task validate:commit -- --edit "{1}"
