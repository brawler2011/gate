root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/backend ./backend"
entrypoint = ["./.air/backend", "-env=deploy/local/.env"]
include_dir = ["backend"]
include_file = ["go.mod", "go.sum", "languages.yaml"]
include_ext = ["go", "mod", "sum", "yaml", "sql", "sty"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "6s"

[misc]
clean_on_exit = true
