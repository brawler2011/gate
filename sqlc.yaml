version: "2"
sql:
  - engine: "postgresql"

    queries: "backend/internal/postgres/*.sql"
    schema: "backend/migrations/"
    gen:
      go:
        package: "sqlc"
        out: "backend/internal/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_interface: true
        overrides:
          - db_type: "pg_catalog.uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"
          - db_type: "varchar"
            go_type: "string"

          - db_type: "pg_catalog.uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - column: "submissions.language"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/submissions/model"
              package: "submissionsmodel"
              type: "LanguageName"
          - column: "contest_drafts.language"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/submissions/model"
              package: "submissionsmodel"
              type: "LanguageName"
          - column: "submissions.state"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/submissions/model"
              package: "submissionsmodel"
              type: "State"
          - column: "outbox_events.status"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/events"
              package: "events"
              type: "OutboxEventStatus"
          - column: "outbox_events.event_type"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/events"
              package: "events"
              type: "OutboxEventType"
          - db_type: "contest_visibility"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/contests/model"
              package: "contestsmodel"
              type: "ContestVisibility"
          - db_type: "contest_role"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/contests/model"
              package: "contestsmodel"
              type: "ContestRole"
          - db_type: "language_name"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/submissions/model"
              package: "submissionsmodel"
              type: "LanguageName"
          - db_type: "state"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/submissions/model"
              package: "submissionsmodel"
              type: "State"
          - db_type: "outbox_event_status"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/events"
              package: "events"
              type: "OutboxEventStatus"
          - db_type: "outbox_event_type"
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/events"
              package: "events"
              type: "OutboxEventType"

          - db_type: "problem_role"
            nullable: false
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/problems/model"
              package: "problemsmodel"
              type: "ProblemRole"

          - db_type: "problem_role"
            nullable: true
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/problems/model"
              package: "problemsmodel"
              type: "ProblemRole"
              pointer: true

          - db_type: "problem_permission"
            nullable: false
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/problems/model"
              package: "problemsmodel"
              type: "ProblemPermission"

          - db_type: "problem_permission"
            nullable: true
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/problems/model"
              package: "problemsmodel"
              type: "ProblemPermission"
              pointer: true

          - db_type: "organization_role"
            nullable: false
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/organizations/model"
              package: "organizationsmodel"
              type: "OrganizationRole"

          - db_type: "organization_role"
            nullable: true
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/organizations/model"
              package: "organizationsmodel"
              type: "OrganizationRole"
              pointer: true

          - db_type: "team_role"
            nullable: false
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/organizations/model"
              package: "organizationsmodel"
              type: "TeamRole"

          - db_type: "team_role"
            nullable: true
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/organizations/model"
              package: "organizationsmodel"
              type: "TeamRole"
              pointer: true

          - db_type: "contest_visibility"
            nullable: true
            go_type:
              import: "github.com/brawler2011/gate/backend/internal/contests/model"
              package: "contestsmodel"
              type: "ContestVisibility"
              pointer: true
          - db_type: "problem_visibility"
            go_type: "string"
          - db_type: "problem_visibility"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          - db_type: "user_role"
            go_type: "string"
          - db_type: "user_role"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          - db_type: "package_status"
            go_type: "string"
          - db_type: "package_status"
            nullable: true
            go_type:
              type: "string"
              pointer: true
