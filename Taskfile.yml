# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  GENERATED_PATHS: >-
    backend/contracts
    frontend/contracts
    backend/internal/postgres/sqlc
    backend/tests/mocks
  DOCKER_COMPOSE: docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml

tasks:
  default:
    cmds:
      - task -a

  precommit:
    desc: Run pre-commit checks across all components
    cmds:
      - task: lint:contracts
      - task: diff:codegen
      - task: precommit:be
      - task: precommit:fe

  precommit:be:
    desc: Run backend pre-commit verification (lint + tests)
    cmds:
      - task: lint:be
      - task: test:be

  precommit:fe:
    desc: Run frontend pre-commit verification (typecheck + lint)
    cmds:
      - task: typecheck:fe
      - task: lint:fe

  dev:
    desc: Run backend and frontend
    deps:
      - dev:be
      - dev:fe

  dev:be:
    desc: Run Go backend server with live reload
    cmds:
      - air -c .air.toml

  dev:fe:
    desc: Run Vite dev server
    cmds:
      - bun dev

  build:
    desc: Build backend and static SPA
    cmds:
      - task: build:be
      - task: build:fe

  build:be:
    desc: Build Go packages
    cmds:
      - go build ./...

  build:fe:
    desc: Build production bundle
    cmds:
      - bun run build

  build:fe:local:
    desc: Build production bundle with local env
    cmds:
      - bun run build:local

  build:fe:prod:
    desc: Build production bundle with prod env
    cmds:
      - bun run build:prod

  test:
    desc: Run backend unit, repository, and frontend tests
    cmds:
      - task: test:be
      - bun test

  test:be:
    desc: Run backend unit and repository tests
    cmds:
      - go test -v ./...

  test:be:integration:
    desc: Run all backend tests, including integration tests
    cmds:
      - go test -v -p 1 -tags=integration {{.CLI_ARGS | default "./..."}}

  bench:be:
    desc: Run PostgreSQL and scoreboard performance benchmarks
    dotenv: [deploy/local/.env]
    cmds:
      - go test -p 1 -tags=benchmark -run='^$' -bench=Benchmark -benchmem -benchtime=100x -cpu=2 ./backend/internal/postgres ./backend/internal/contests {{.CLI_ARGS}}

  lint:be:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./backend/...
      - task: lint:sql

  lint:sql:
    desc: Check for unused sqlc queries in production code
    cmds:
      - go run ./tools/unusedsqlc

  lint:fe:
    desc: Run ESLint and Stylelint
    cmds:
      - bun run lint

  lint:contracts:
    desc: Validate OpenAPI and AsyncAPI contracts
    cmds:
      - >-
        vacuum
        lint contracts/core/v1/openapi.yaml
        --ruleset vacuum.yaml
        --no-style --no-banner --no-update-check
        --details --errors --all-results --fail-severity error
      - bun run tools/generate-observer.ts --validate

  typecheck:fe:
    desc: Run TypeScript type check
    cmds:
      - bun run typecheck

  knip:fe:
    desc: Run Knip unused code check
    cmds:
      - bun run knip

  gen:
    desc: Generate all code (contracts, SQLC, Mocks)
    cmds:
      - task: gen:contracts
      - task: gen:sqlc
      - task: gen:mocks

  gen:contracts:
    desc: Generate OpenAPI and AsyncAPI Go and TS contracts
    cmds:
      - mkdir -p backend/contracts/core/v1 backend/contracts/observer/v1
      - >-
        ogen
        --config ogen.yaml
        --package corev1
        --target backend/contracts/core/v1
        --clean contracts/core/v1/openapi.yaml
      - bun run contracts:gen
      - goimports -w backend/contracts/observer/v1

  gen:sqlc:
    desc: Generate SQLC queries
    sources:
      - sqlc.yaml
      - backend/migrations/*.sql
      - backend/internal/postgres/*.sql
    generates:
      - backend/internal/postgres/sqlc/*.go
    cmds:
      - >-
        sqlc
        generate -f sqlc.yaml

  gen:mocks:
    desc: Generate Go mocks
    cmds:
      - go generate ./...

  diff:codegen:
    desc: Verify codegen freshness for CI
    cmds:
      - task: gen
      - |
        if [ -n "$(git status --porcelain {{.GENERATED_PATHS}})" ]; then
          echo "ERROR: Generated code is out of date."
          exit 1
        fi

  clean:
    desc: Remove generated contract files
    cmds:
      - rm -rf backend/contracts/core/v1 backend/contracts/observer/v1
      - rm -rf frontend/contracts/core/v1 frontend/contracts/observer/v1

  migrate:be:
    desc: Apply database migrations
    cmds:
      - go run ./backend -env=deploy/local/.env -migrate

  docker:up:
    desc: Start local Docker containers in background
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d {{.CLI_ARGS}}"

  docker:down:
    desc: Stop local Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} down {{.CLI_ARGS}}"

  docker:restart:
    desc: Restart local Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} restart {{.CLI_ARGS}}"

  docker:status:
    desc: Show status of local Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} ps {{.CLI_ARGS}}"

  docker:logs:
    desc: View logs from local Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} logs {{.CLI_ARGS}}"

  install:hooks:
    desc: Install Lefthook and setup git pre-commit hooks
    cmds:
      - lefthook install

  validate:commit:
    desc: Validate commit message or PR title format and length
    cmds:
      - bun run commit:validate {{.CLI_ARGS}}

  status:pr:
    desc: Show GitHub PR status and CI checks for current branch
    cmds:
      - gh pr status
      - gh pr checks || true
