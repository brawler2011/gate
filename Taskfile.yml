version: "3"

includes:
  be:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend
  fe:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  contracts:
    taskfile: ./contracts/Taskfile.yml
    dir: ./contracts
  e2e:
    taskfile: ./tests/e2e/Taskfile.yml
    dir: ./tests/e2e

tasks:
  default:
    cmds:
      - task -a

  precommit:
    desc: "Run pre-commit checks across all components"
    cmds:
      - task: verify-codegen
      - task: tasks:validate
      - task: precommit:be
      - task: precommit:fe

  tasks:validate:
    desc: "Validate task markdown files against schema and rules"
    cmds:
      - go -C tools/taskvalidator run . {{.CLI_ARGS}}

  commit:validate:
    desc: "Validate commit message or PR title format and length"
    cmds:
      - go -C tools/commitvalidator run . {{.CLI_ARGS}}

  hooks:install:
    desc: "Install Lefthook and setup git pre-commit hooks"
    cmds:
      - |
        if ! command -v lefthook >/dev/null 2>&1; then
          echo "Installing lefthook via go install..."
          go install github.com/evilmartians/lefthook@latest
        fi
        PATH="$PATH:$(go env GOPATH)/bin" lefthook install


  precommit:be:
    desc: "Run backend pre-commit verification (lint + tests)"
    cmds:
      - task: be:lint
      - task: be:test

  precommit:fe:
    desc: "Run frontend pre-commit verification (typecheck + lint)"
    cmds:
      - task: fe:typecheck
      - task: fe:lint

  test:e2e:
    desc: "Run complete E2E Observability test suite across Tiers 1-4"
    cmds:
      - task: e2e:test

  gen:
    desc: "Generate all code (OpenAPI, SQLC, Mocks)"
    cmds:
      - task: contracts:gen-openapi
      - task: be:gen-sqlc
      - task: be:gen-mocks

  verify-codegen:
    desc: "Verify codegen freshness for CI"
    cmds:
      - task: gen
      - cmd: |
          if [ -n "$(git status --porcelain backend/contracts frontend/contracts backend/internal/repository/pg/sqlc backend/tests/mocks)" ]; then
            echo "ERROR: Generated code is out of date.";
            exit 1;
          fi

  clean:
    desc: "Remove generated contract files"
    cmds:
      - rm -rf backend/contracts/core/v1 backend/contracts/observer/v1
      - rm -rf frontend/contracts/core/v1 frontend/contracts/observer/v1
