# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  AIR_VERSION: v1.64.5
  LEFTHOOK_VERSION: v1.13.6
  SQLC_VERSION: v1.27.0
  VACUUM_VERSION: v0.33.0
  OGEN_VERSION: v1.24.0
  OAPI_CODEGEN_VERSION: v2.5.0
  GENERATED_PATHS: >-
    backend/contracts
    frontend/contracts
    backend/internal/repository/pg/sqlc
    backend/tests/mocks

tasks:
  default:
    cmds:
      - task -a

  precommit:
    desc: Run pre-commit checks across all components
    cmds:
      - task: lint:contracts
      - task: diff:codegen
      - task: precommit:be
      - task: precommit:fe

  precommit:be:
    desc: Run backend pre-commit verification (lint + tests)
    cmds:
      - task: lint:be
      - task: test:be

  precommit:fe:
    desc: Run frontend pre-commit verification (typecheck + lint)
    cmds:
      - task: typecheck:fe
      - task: lint:fe

  dev:
    desc: Run backend and frontend
    deps:
      - dev:be
      - dev:fe

  dev:be:
    desc: Run Go backend server with live reload
    cmds:
      - go run github.com/air-verse/air@{{.AIR_VERSION}} -c .air.toml

  dev:fe:
    desc: Run Vite dev server
    cmds:
      - bun dev

  build:
    desc: Build backend and static SPA
    cmds:
      - task: build:be
      - task: build:fe

  build:be:
    desc: Build Go packages
    cmds:
      - go build ./...

  build:fe:
    desc: Build production bundle
    cmds:
      - bun run build

  build:fe:local:
    desc: Build production bundle with local env
    cmds:
      - bun run build:local

  build:fe:prod:
    desc: Build production bundle with prod env
    cmds:
      - bun run build:prod

  test:
    desc: Run backend unit, repository, and frontend tests
    cmds:
      - task: test:be
      - bun test

  test:be:
    desc: Run backend unit and repository tests
    cmds:
      - go test -v ./...

  test:be:integration:
    desc: Run all backend tests, including integration tests
    cmds:
      - go test -v -p 1 -tags=integration ./...

  lint:be:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./backend/...

  lint:fe:
    desc: Run ESLint and Stylelint
    cmds:
      - bun run lint

  lint:contracts:
    desc: Validate OpenAPI contracts (correctness errors block, warnings are advisory)
    dir: contracts
    cmds:
      - >-
        GOTOOLCHAIN=auto go run github.com/daveshanley/vacuum@{{.VACUUM_VERSION}}
        lint core/v1/openapi.yaml observer/v1/openapi.yaml
        --ruleset vacuum.yaml
        --no-style --no-banner --no-update-check
        --details --errors --all-results --fail-severity error

  typecheck:fe:
    desc: Run TypeScript type check
    cmds:
      - bun run typecheck

  knip:fe:
    desc: Run Knip unused code check
    cmds:
      - bun run knip

  gen:
    desc: Generate all code (OpenAPI, SQLC, Mocks)
    cmds:
      - task: gen:contracts
      - task: gen:sqlc
      - task: gen:mocks

  gen:contracts:
    desc: Generate OpenAPI Go handlers and TS clients
    cmds:
      - mkdir -p backend/contracts/core/v1 backend/contracts/observer/v1
      - >-
        go run github.com/ogen-go/ogen/cmd/ogen@{{.OGEN_VERSION}}
        --config contracts/ogen.yml
        --package corev1
        --target backend/contracts/core/v1
        --clean contracts/core/v1/openapi.yaml
      - >-
        go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
        -generate std-http-server,models,strict-server,skip-prune
        -package observerv1
        -o backend/contracts/observer/v1/observer.go
        contracts/observer/v1/openapi.yaml
      - bun run contracts:gen

  gen:sqlc:
    desc: Generate SQLC queries
    sources:
      - backend/sqlc.yaml
      - backend/migrations/*.sql
      - backend/internal/repository/pg/*.sql
    generates:
      - backend/internal/repository/pg/sqlc/*.go
    cmds:
      - >-
        go run github.com/sqlc-dev/sqlc/cmd/sqlc@{{.SQLC_VERSION}}
        generate -f backend/sqlc.yaml

  gen:mocks:
    desc: Generate Go mocks
    cmds:
      - go generate ./...

  diff:codegen:
    desc: Verify codegen freshness for CI
    cmds:
      - task: gen
      - |
        if [ -n "$(git status --porcelain {{.GENERATED_PATHS}})" ]; then
          echo "ERROR: Generated code is out of date."
          exit 1
        fi

  clean:
    desc: Remove generated contract files
    cmds:
      - rm -rf backend/contracts/core/v1 backend/contracts/observer/v1
      - rm -rf frontend/contracts/core/v1 frontend/contracts/observer/v1

  migrate:be:
    desc: Apply database migrations
    cmds:
      - go run ./backend -env=deploy/local/.env -migrate

  install:hooks:
    desc: Install Lefthook and setup git pre-commit hooks
    cmds:
      - |
        if ! command -v lefthook >/dev/null 2>&1; then
          echo "Installing lefthook via go install..."
          go install github.com/evilmartians/lefthook@{{.LEFTHOOK_VERSION}}
        fi
        PATH="$PATH:$(go env GOPATH)/bin" lefthook install

  validate:commit:
    desc: Validate commit message or PR title format and length
    cmds:
      - bun run commit:validate {{.CLI_ARGS}}

  status:pr:
    desc: Show GitHub PR status and CI checks for current branch
    cmds:
      - gh pr status
      - gh pr checks || true
