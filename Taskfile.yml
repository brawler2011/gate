# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  GENERATED_PATHS: >-
    backend/contracts
    frontend/contracts
    backend/internal/postgres/sqlc
  # deploy/k3s/install.sh names the local k3s context; naming it avoids touching another cluster.
  KUBECTL: kubectl --context gate
  HELM: helm --kube-context gate

tasks:
  default:
    cmds:
      - task -a

  check:
    desc: Run required CI checks except integration tests (be:test:integration, be:querywork) and image builds (judge, backend)
    cmds:
      - task: contracts:lint
      - task: gen:check
      - task: be:lint
      - task: be:test
      - task: deploy:lint
      - task: fe:typecheck
      - task: fe:lint
      - task: fe:knip
      - task: fe:test
      - task: fe:build

  dev:
    desc: Run backend and frontend
    deps:
      - be:dev
      - fe:dev

  be:dev:
    desc: Run Go backend server with live reload
    cmds:
      - air -c .air.toml

  fe:dev:
    desc: Run Vite dev server
    cmds:
      - bun dev

  fe:build:
    desc: Build production bundle
    cmds:
      - bun run build

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: be:test
      - task: fe:test

  be:test:
    desc: Run backend unit tests
    cmds:
      - go test ./backend/...

  fe:test:
    desc: Run frontend tests
    cmds:
      - bun run test

  judge:image:
    desc: Make the go-judge image for the current judge/ sources available locally (pull, else build)
    cmds:
      - |
        ref="$(go run ./tools/judgeimage)"
        docker image inspect "$ref" > /dev/null 2>&1 || docker pull "$ref" || task judge:build

  judge:build:
    desc: Build the go-judge image from judge/flake.nix into the local Docker daemon without a local Nix install
    cmds:
      # Keep the Nix store between builds; the volume must match its seed image.
      - >-
        docker run --rm -v gate-judge-nix-2.35.6:/nix -v ./judge:/src:ro -w /src
        -v /var/run/docker.sock:/var/run/docker.sock nixos/nix:2.35.6
        nix --extra-experimental-features "nix-command flakes" run .#default.copyTo --
        docker-daemon:"$(go run ./tools/judgeimage)"

  be:test:integration:
    desc: Run backend integration tests, which live in backend/tests/integration
    deps: [judge:image]
    cmds:
      - go test -v -timeout 15m -tags=integration {{.CLI_ARGS | default "./backend/tests/integration/..."}}

  be:querywork:
    desc: Check PostgreSQL query work against upper budgets in backend/internal/postgres/testdata/query_work.json
    cmds:
      - go test -v -count=1 -tags=integration -run='^TestQueryWork$' ./backend/internal/postgres

  be:querywork:update:
    desc: Raise PostgreSQL query-work budgets to include measurements; edit query_work.json explicitly to tighten
    cmds:
      - go test -count=1 -tags=integration -run='^TestQueryWork$' ./backend/internal/postgres -update

  be:bench:
    desc: Run PostgreSQL and scoreboard performance benchmarks
    cmds:
      - go test -p 1 -tags=benchmark -run='^$' -bench=Benchmark -benchmem -benchtime=100x -cpu=2 ./backend/internal/postgres ./backend/internal/contests {{.CLI_ARGS}}

  be:lint:
    desc: Run golangci-lint and check for unused sqlc queries
    cmds:
      - golangci-lint run ./backend/...
      - go run ./tools/unusedsqlc

  deploy:lint:
    desc: Lint the Helm charts with the values of every environment
    cmds:
      - for: [prod, cluster]
        cmd: >-
          helm lint --strict deploy/charts/gate-infra -f deploy/{{.ITEM}}/gate-infra.yaml &&
          helm lint --strict deploy/charts/gate -f deploy/{{.ITEM}}/gate.yaml --set-file backend.config=deploy/{{.ITEM}}/config.yaml --set imageTag=lint
      - helm lint --strict deploy/charts/gate-infra -f deploy/local/gate-infra.yaml --set judge.image=lint --set judge.problemWork=/lint

  fe:lint:
    desc: Run ESLint and Stylelint
    cmds:
      - bun run lint

  contracts:lint:
    desc: Validate OpenAPI and AsyncAPI contracts
    cmds:
      - >-
        vacuum
        lint contracts/core/v1/openapi.yaml
        --ruleset vacuum.yaml
        --no-style --no-banner --no-update-check
        --details --errors --all-results --fail-severity error
      - bun run tools/generate-observer.ts --validate

  fe:typecheck:
    desc: Run TypeScript type check
    cmds:
      - bun run typecheck

  fe:knip:
    desc: Run Knip unused code check
    cmds:
      - bun run knip

  gen:
    desc: Generate all code (contracts, SQLC)
    cmds:
      - task: contracts:gen
      - task: sqlc:gen

  contracts:gen:
    desc: Generate OpenAPI and AsyncAPI Go and TS contracts
    cmds:
      - mkdir -p backend/contracts/core/v1 backend/contracts/observer/v1
      - >-
        ogen
        --config ogen.yaml
        --package corev1
        --target backend/contracts/core/v1
        --clean contracts/core/v1/openapi.yaml
      - bun run contracts:gen
      - goimports -w backend/contracts/observer/v1

  sqlc:gen:
    desc: Generate SQLC queries
    sources:
      - sqlc.yaml
      - backend/migrations/*.sql
      - backend/internal/postgres/*.sql
    generates:
      - backend/internal/postgres/sqlc/*.go
    cmds:
      # sqlc never deletes outputs whose queries were removed.
      - rm -f backend/internal/postgres/sqlc/*.go
      - >-
        sqlc
        generate -f sqlc.yaml


  gen:check:
    desc: Regenerate files and fail if generated files changed
    cmds:
      - task: gen
      - |
        if [ -n "$(git status --porcelain {{.GENERATED_PATHS}})" ]; then
          echo "ERROR: Generated code is out of date."
          exit 1
        fi

  testlib:update:
    desc: "Vendor testlib.h and its standard checkers of an upstream commit into backend/pkg/syslib/testlib: task testlib:update -- <commit>"
    requires:
      vars: [CLI_ARGS]
    cmds:
      - |
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        git clone -q https://github.com/MikeMirzayanov/testlib "$tmp"
        git -C "$tmp" checkout -q --detach "{{.CLI_ARGS}}"
        cp "$tmp/testlib.h" "$tmp/LICENSE" backend/pkg/syslib/testlib/
        rm -rf backend/pkg/syslib/testlib/checkers
        mkdir backend/pkg/syslib/testlib/checkers
        cp "$tmp"/checkers/*.cpp backend/pkg/syslib/testlib/checkers/
        # Normalize upstream CRLF because authors edit copies of these checkers.
        sed -i 's/\r$//' backend/pkg/syslib/testlib/checkers/*.cpp
        git -C "$tmp" rev-parse HEAD > backend/pkg/syslib/testlib/COMMIT
        # Recognize imported upstream copies by blob ID so they can auto-update.
        for c in $(git -C "$tmp" log --format=%H HEAD -- testlib.h); do
          git -C "$tmp" rev-parse -q --verify "${c}:testlib.h" || true
        done | sort -u > backend/pkg/syslib/testlib/upstream.txt

  judge:update:
    desc: Update all judge flake inputs (judge/flake.lock) without a local Nix install
    cmds:
      - >-
        docker run --rm -v ./judge:/src -w /src nixos/nix:2.35.6
        sh -c 'nix --extra-experimental-features "nix-command flakes" flake update && chown {{.UID}}:{{.GID}} flake.lock'
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g

  clean:
    desc: Remove all generated files
    cmds:
      - rm -rf {{.GENERATED_PATHS}}

  be:migrate:
    desc: Apply the schema, resetting all local data if it changed
    cmds:
      - go run ./backend -config=deploy/local/config.yaml -env=deploy/local/.env -migrate

  k3s:up:
    internal: true
    cmds:
      - "{{.KUBECTL}} apply -f deploy/k3s/"

  k3s:secrets:
    internal: true
    requires:
      vars: [NAMESPACE]
    cmds:
      - "{{.KUBECTL}} create namespace {{.NAMESPACE}} --dry-run=client -o yaml | {{.KUBECTL}} apply -f -"
      - |
        set -a; . deploy/local/.env; set +a
        sh deploy/secrets.sh {{.KUBECTL}} -n {{.NAMESPACE}}

  infra:up:
    desc: Deploy PostgreSQL, SeaweedFS and go-judge for task dev to local k3s (namespace gate-dev)
    deps: [k3s:up, judge:image]
    vars:
      JUDGE_IMAGE:
        sh: go run ./tools/judgeimage
    cmds:
      - mkdir -p backend/data/problem-work
      - |
        {{.KUBECTL}} get nodes -o jsonpath='{.items[*].status.images[*].names[*]}' | tr ' ' '\n' | grep -qxF '{{.JUDGE_IMAGE}}' \
          || docker save '{{.JUDGE_IMAGE}}' | sudo k3s ctr images import -
      - task: k3s:secrets
        vars: {NAMESPACE: gate-dev}
      - >-
        {{.HELM}} upgrade --install gate-infra deploy/charts/gate-infra -n gate-dev -f deploy/local/gate-infra.yaml
        --set judge.image={{.JUDGE_IMAGE}} --set judge.problemWork={{.ROOT_DIR}}/backend/data/problem-work
        --wait --timeout 5m

  infra:down:
    desc: Remove the task infra:up services, keeping their data (delete namespace gate-dev to reset it)
    cmds:
      - "{{.HELM}} uninstall gate-infra -n gate-dev --ignore-not-found --wait"

  cluster:deploy:
    desc: Build the images and deploy both charts to local k3s (namespace gate) at https://gate.localhost:30443
    deps: [k3s:up, judge:image]
    vars:
      TAG:
        sh: echo "local-$(date +%s)"
    cmds:
      - docker build -t ghcr.io/brawler2011/gate-backend:{{.TAG}} .
      - docker tag "$(go run ./tools/judgeimage)" ghcr.io/brawler2011/gate-go-judge:{{.TAG}}
      # The k3s containerd socket is root-only.
      - docker save ghcr.io/brawler2011/gate-backend:{{.TAG}} ghcr.io/brawler2011/gate-go-judge:{{.TAG}} | sudo k3s ctr images import -
      - task: k3s:secrets
        vars: {NAMESPACE: gate}
      - "{{.HELM}} upgrade --install gate-infra deploy/charts/gate-infra -n gate -f deploy/cluster/gate-infra.yaml --wait --timeout 5m"
      - "{{.HELM}} upgrade --install gate deploy/charts/gate -n gate -f deploy/cluster/gate.yaml --set-file backend.config=deploy/cluster/config.yaml --set imageTag={{.TAG}} --rollback-on-failure --timeout 5m {{.CLI_ARGS}}"

  cluster:down:
    desc: Delete the task cluster:deploy releases and their data
    cmds:
      - "{{.KUBECTL}} delete namespace gate --ignore-not-found"

  hooks:install:
    desc: Install Git hooks using Lefthook
    cmds:
      - lefthook install

  commit:validate:
    desc: Validate commit message or PR title format and length
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "$1" = "--edit" ]; then
          bun run commit:validate "$@"
        else
          printf '%s\n' "$*" | bun run commit:validate
        fi
