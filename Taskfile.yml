# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  GENERATED_PATHS: >-
    backend/contracts
    frontend/contracts
    backend/internal/postgres/sqlc
    backend/tests/mocks
  # JUDGE_IMAGE names the go-judge image built from the current judge/ sources.
  DOCKER_COMPOSE: JUDGE_IMAGE="$(go run ./tools/judgeimage)" docker compose --env-file deploy/local/.env -f deploy/local/docker-compose.yml
  # The local k3s cluster; commands name its context so they never touch another cluster.
  K3D_KUBECTL: kubectl --context k3d-gate
  K3D_HELM: helm --kube-context k3d-gate

tasks:
  default:
    cmds:
      - task -a

  check:
    desc: Run required CI checks except integration tests (be:test:integration, be:querywork) and image builds (judge, backend)
    cmds:
      - task: contracts:lint
      - task: gen:check
      - task: be:lint
      - task: be:test
      - task: deploy:lint
      - task: fe:typecheck
      - task: fe:lint
      - task: fe:knip
      - task: fe:test
      - task: fe:build

  dev:
    desc: Run backend and frontend
    deps:
      - be:dev
      - fe:dev

  be:dev:
    desc: Run Go backend server with live reload
    cmds:
      - air -c .air.toml

  fe:dev:
    desc: Run Vite dev server
    cmds:
      - bun dev

  fe:build:
    desc: Build production bundle
    cmds:
      - bun run build

  test:
    desc: Run backend and frontend tests
    cmds:
      - task: be:test
      - task: fe:test

  be:test:
    desc: Run backend unit tests
    cmds:
      - go test ./backend/...

  fe:test:
    desc: Run frontend tests
    cmds:
      - bun run test

  judge:image:
    desc: Make the go-judge image for the current judge/ sources available locally (pull, else build)
    cmds:
      - |
        ref="$(go run ./tools/judgeimage)"
        docker image inspect "$ref" > /dev/null 2>&1 || docker pull "$ref" || task judge:build

  judge:build:
    desc: Build the go-judge image from judge/flake.nix into the local Docker daemon without a local Nix install
    cmds:
      # The volume keeps the Nix store between builds; it is named after the Nix image it was seeded from.
      - >-
        docker run --rm -v gate-judge-nix-2.35.6:/nix -v ./judge:/src:ro -w /src
        -v /var/run/docker.sock:/var/run/docker.sock nixos/nix:2.35.6
        nix --extra-experimental-features "nix-command flakes" run .#default.copyTo --
        docker-daemon:"$(go run ./tools/judgeimage)"

  be:test:integration:
    desc: Run backend integration tests, which live in backend/tests/integration
    deps: [judge:image]
    cmds:
      - go test -v -timeout 15m -tags=integration {{.CLI_ARGS | default "./backend/tests/integration/..."}}

  be:querywork:
    desc: Check the database work of PostgreSQL scenarios against backend/internal/postgres/testdata/query_work.json
    cmds:
      - go test -v -count=1 -tags=integration -run='^TestQueryWork$' ./backend/internal/postgres

  be:querywork:update:
    desc: Rewrite backend/internal/postgres/testdata/query_work.json with the measured database work
    cmds:
      - go test -count=1 -tags=integration -run='^TestQueryWork$' ./backend/internal/postgres -update

  be:bench:
    desc: Run PostgreSQL and scoreboard performance benchmarks
    cmds:
      - go test -p 1 -tags=benchmark -run='^$' -bench=Benchmark -benchmem -benchtime=100x -cpu=2 ./backend/internal/postgres ./backend/internal/contests {{.CLI_ARGS}}

  be:lint:
    desc: Run golangci-lint and check for unused sqlc queries
    cmds:
      - golangci-lint run ./backend/...
      - go run ./tools/unusedsqlc

  deploy:lint:
    desc: Lint the Helm charts with the values of every environment
    cmds:
      - for: [prod, k3d]
        cmd: >-
          helm lint --strict deploy/charts/gate-infra -f deploy/{{.ITEM}}/gate-infra.yaml &&
          helm lint --strict deploy/charts/gate -f deploy/{{.ITEM}}/gate.yaml --set-file backend.config=deploy/{{.ITEM}}/config.yaml --set imageTag=lint

  fe:lint:
    desc: Run ESLint and Stylelint
    cmds:
      - bun run lint

  contracts:lint:
    desc: Validate OpenAPI and AsyncAPI contracts
    cmds:
      - >-
        vacuum
        lint contracts/core/v1/openapi.yaml
        --ruleset vacuum.yaml
        --no-style --no-banner --no-update-check
        --details --errors --all-results --fail-severity error
      - bun run tools/generate-observer.ts --validate

  fe:typecheck:
    desc: Run TypeScript type check
    cmds:
      - bun run typecheck

  fe:knip:
    desc: Run Knip unused code check
    cmds:
      - bun run knip

  gen:
    desc: Generate all code (contracts, SQLC, Mocks)
    cmds:
      - task: contracts:gen
      - task: sqlc:gen
      - task: mocks:gen

  contracts:gen:
    desc: Generate OpenAPI and AsyncAPI Go and TS contracts
    cmds:
      - mkdir -p backend/contracts/core/v1 backend/contracts/observer/v1
      - >-
        ogen
        --config ogen.yaml
        --package corev1
        --target backend/contracts/core/v1
        --clean contracts/core/v1/openapi.yaml
      - bun run contracts:gen
      - goimports -w backend/contracts/observer/v1

  sqlc:gen:
    desc: Generate SQLC queries
    sources:
      - sqlc.yaml
      - backend/migrations/*.sql
      - backend/internal/postgres/*.sql
    generates:
      - backend/internal/postgres/sqlc/*.go
    cmds:
      - >-
        sqlc
        generate -f sqlc.yaml

  mocks:gen:
    desc: Generate Go mocks
    cmds:
      - go generate ./...

  gen:check:
    desc: Regenerate files and fail if generated files changed
    cmds:
      - task: gen
      - |
        if [ -n "$(git status --porcelain {{.GENERATED_PATHS}})" ]; then
          echo "ERROR: Generated code is out of date."
          exit 1
        fi

  judge:update:
    desc: Update all judge flake inputs (judge/flake.lock) without a local Nix install
    cmds:
      - >-
        docker run --rm -v ./judge:/src -w /src nixos/nix:2.35.6
        sh -c 'nix --extra-experimental-features "nix-command flakes" flake update && chown {{.UID}}:{{.GID}} flake.lock'
    vars:
      UID:
        sh: id -u
      GID:
        sh: id -g

  clean:
    desc: Remove all generated files
    cmds:
      - rm -rf {{.GENERATED_PATHS}}

  be:migrate:
    desc: Apply the schema, resetting all local data if it changed
    cmds:
      - go run ./backend -config=deploy/local/config.yaml -env=deploy/local/.env -migrate

  docker:up:
    desc: Start local Docker containers in background
    deps: [judge:image]
    cmds:
      - "{{.DOCKER_COMPOSE}} up -d {{.CLI_ARGS}}"

  docker:down:
    desc: Stop local Docker containers
    cmds:
      - "{{.DOCKER_COMPOSE}} down {{.CLI_ARGS}}"

  k3d:up:
    desc: Create the local k3s cluster (k3d) with the deploy/k3s bootstrap
    status:
      - k3d cluster get gate
    cmds:
      - k3d cluster create gate --image rancher/k3s:v1.37.1-k3s1 -p "9080:80@loadbalancer" -p "9443:443@loadbalancer" --kubeconfig-switch-context=false --wait
      - "{{.K3D_KUBECTL}} apply -f deploy/k3s/"

  k3d:deploy:
    desc: Build the images and deploy both charts to the local cluster at https://gate.localhost:9443
    deps: [k3d:up, judge:image]
    vars:
      TAG:
        sh: echo "local-$(date +%s)"
    cmds:
      - docker build -t ghcr.io/brawler2011/gate-backend:{{.TAG}} .
      - docker tag "$(go run ./tools/judgeimage)" ghcr.io/brawler2011/gate-go-judge:{{.TAG}}
      - k3d image import -c gate ghcr.io/brawler2011/gate-backend:{{.TAG}} ghcr.io/brawler2011/gate-go-judge:{{.TAG}}
      - "{{.K3D_KUBECTL}} create namespace gate --dry-run=client -o yaml | {{.K3D_KUBECTL}} apply -f -"
      - |
        set -a; . deploy/local/.env; set +a
        sh deploy/secrets.sh {{.K3D_KUBECTL}} -n gate
      - "{{.K3D_HELM}} upgrade --install gate-infra deploy/charts/gate-infra -n gate -f deploy/k3d/gate-infra.yaml --wait --timeout 5m"
      - "{{.K3D_HELM}} upgrade --install gate deploy/charts/gate -n gate -f deploy/k3d/gate.yaml --set-file backend.config=deploy/k3d/config.yaml --set imageTag={{.TAG}} --rollback-on-failure --timeout 5m {{.CLI_ARGS}}"

  k3d:down:
    desc: Delete the local k3s cluster and its data
    cmds:
      - k3d cluster delete gate

  hooks:install:
    desc: Install Git hooks using Lefthook
    cmds:
      - lefthook install

  commit:validate:
    desc: Validate commit message or PR title format and length
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "$1" = "--edit" ]; then
          bun run commit:validate "$@"
        else
          printf '%s\n' "$*" | bun run commit:validate
        fi
