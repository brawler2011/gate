apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      # The LoadBalancer address is the node IP, so local k3s reaches Traefik on loopback through this NodePort.
      websecure:
        nodePort: 30443
      web:
        http:
          redirections:
            entryPoint: {to: websecure, scheme: https, permanent: true}
    service:
      spec:
        # Preserve client IPs for backend rate limits.
        externalTrafficPolicy: Local
    persistence:
      enabled: true
    certificatesResolvers:
      letsencrypt:
        acme:
          email: slavabirin1@yandex.ru
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
