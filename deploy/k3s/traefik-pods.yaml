# Resolve only Traefik pod IPs for the backend's trusted proxy list.
apiVersion: v1
kind: Service
metadata:
  name: traefik-pods
  namespace: kube-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - {name: web, port: 8000}
