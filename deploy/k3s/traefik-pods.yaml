# Headless service whose DNS name resolves to the Traefik pod IPs. The backend's
# http.trusted_proxy names it: only requests from these pods may carry a client IP
# in X-Forwarded-For.
apiVersion: v1
kind: Service
metadata:
  name: traefik-pods
  namespace: kube-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - {name: web, port: 8000}
