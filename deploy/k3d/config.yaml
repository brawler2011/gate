http:
  address: :8080
  trusted_proxy: traefik-pods.kube-system.svc.cluster.local
  secure_cookies: true
go_judge:
  grpc_addr: 127.0.0.1:5051
  http_url: http://127.0.0.1:5050
storage:
  s3_endpoint: http://s3:8333
email:
  provider: log
  from: Gate <no-reply@gate.localhost>
  app_base_url: https://gate.localhost:9443
inbox:
  retention: 168h
judge:
  manifest_dir: /etc/judge
  workers: 4
problems:
  work_dir: /problem-work
  draft:
    file_bytes: 1MiB
    text_bytes: 8MiB
    files: 1000
    tests: 10000
    components: 100
    subtasks: 100
  limits:
    disk_bytes: 8GiB
    file_count: 25000
    object_bytes: 512MiB
    test_output_bytes: 512MiB
    compile:
      cpu: 20s
      wall: 60s
      memory: 512MiB
      processes: 150
      output: 64MiB
      diagnostic: 64KiB
    auxiliary:
      cpu: 5s
      wall: 15s
      memory: 256MiB
      processes: 50
      output: 512MiB
      diagnostic: 64KiB
  parallelism: 1
  attempts: 3
  lease: 30s
  poll: 1s
  duration: 30m
  operation_lease: 10m
  upload_ttl: 5m
  gc_interval: 1m
  object_retention: 24h
  build_retention: 168h
  package_retention: 720h
  request_bytes: 16MiB
