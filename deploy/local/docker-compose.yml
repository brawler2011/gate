services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:18-alpine
    container_name: gate-postgres-local
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - gate-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s



  redis:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: redis:7.2.4-alpine
    container_name: gate-redis-local
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks:
      - gate-local

  nats:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: nats:2.10-alpine
    container_name: gate-nats-local
    hostname: nats
    restart: unless-stopped
    command: ["--js", "--store_dir=/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - gate-local

  go-judge:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ../common/judge
      dockerfile: Dockerfile
    image: ghcr.io/brawler2011/gate-go-judge:latest
    container_name: gate-go-judge-local
    hostname: go-judge
    restart: unless-stopped
    command:
      - "-enable-grpc"
      - "-grpc-addr=0.0.0.0:5051"
    ports:
      - "5051:5051"
    privileged: true
    volumes:
      - ./go-judge-data:/data
    networks:
      - gate-local

  traefik:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: traefik:v3.7
    container_name: gate-traefik-local
    hostname: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - go-judge
    networks:
      - gate-local
    extra_hosts:
      - "host.docker.internal:host-gateway"

  master:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-master-local
    volumes:
      - seaweedfs-master:/data
    networks:
      - gate-local
    ports:
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:19333:19333"
    command: "-v 9 master -ip=master -ip.bind=0.0.0.0"
    restart: always
  volume:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-volume-local
    volumes:
      - seaweedfs-volume:/data
    networks:
      - gate-local
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:18080:18080"
    command: '-v 9 volume -mserver="master:9333" -ip=volume -ip.bind=0.0.0.0 -port=2 -dir=/data -max=100'
    depends_on:
      - master
    restart: always
  filer:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-filer-local
    volumes:
      - seaweedfs-filer:/data
    networks:
      - gate-local
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:18888:18888"
    command: '-v 9 filer -master="master:9333" -ip.bind=0.0.0.0'
    depends_on:
      - master
      - volume
    restart: always
  s3:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-s3-local
    hostname: s3
    networks:
      - gate-local
    ports:
      - "127.0.0.1:8333:8333"
    command: '-v 9 s3 -filer="filer:8888" -ip.bind=0.0.0.0 -config=/etc/seaweedfs/s3.json'
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json
    depends_on:
      - master
      - volume
      - filer
    restart: always

volumes:
  postgres-data:
    name: gate-postgres-data-local
  redis-data:
    name: gate-redis-data-local
  nats-data:
    name: gate-nats-data-local
  seaweedfs-master:
    name: gate-seaweedfs-master-local
  seaweedfs-volume:
    name: gate-seaweedfs-volume-local
  seaweedfs-filer:
    name: gate-seaweedfs-filer-local
networks:
  gate-local:
    name: gate-network-local
    driver: bridge
