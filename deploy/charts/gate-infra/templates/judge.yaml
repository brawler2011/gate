{{- with .Values.judge }}
{{- if .image }}
# A standalone go-judge for a backend on the host, which shares problem files through hostPath.
apiVersion: v1
kind: Service
metadata:
  name: go-judge
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: go-judge}
  ports:
    - {name: http, port: 5050, nodePort: {{ required "judge.nodePort is required" .nodePort }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-judge
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: go-judge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: go-judge}
    spec:
      enableServiceLinks: false
      containers:
        - name: go-judge
          image: {{ .image }}
          args: [-http-addr=0.0.0.0:5050, -dir=/data, -src-prefix=/problem-work/cache, -no-fallback]
          securityContext: {privileged: true, seccompProfile: {type: Unconfined}}
          ports:
            - {name: http, containerPort: 5050}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: problem-work, mountPath: /problem-work, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: problem-work
          hostPath: {path: {{ required "judge.problemWork is required" .problemWork }}, type: Directory}
{{- end }}
{{- end }}
