apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: s3, port: 8333}
---
# Master, volume, filer and S3 gateway in one process: one node needs no more.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs}
    spec:
      # Services are found by DNS; their env variables (e.g. S3_PORT) would clash with app settings.
      enableServiceLinks: false
      securityContext:
        {{- include "gate-infra.podSecurity" . | nindent 8 }}
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          env:
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: S3_SECRET_KEY}}
          # The S3 identity comes from the shared secret, the same keys the backend uses.
          # Every bucket is a collection with volumes of its own. Volumes are not
          # preallocated, so many small ones only cost slots. minFreeSpace stops
          # volume writes to leave filesystem space for other services; the PVC
          # storage request is not a quota on local-path. With -volume.max=0
          # SeaweedFS instead derives the count from free space and 30 GB volumes,
          # which on a small disk leaves a single volume for every bucket.
          command: [/bin/sh, -c]
          args:
            - |
              cat > /tmp/s3.json <<EOF
              {"identities": [{"name": "gate", "credentials": [{"accessKey": "$S3_ACCESS_KEY", "secretKey": "$S3_SECRET_KEY"}],
                "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
              EOF
              exec weed server -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 -master.volumeSizeLimitMB={{ .Values.seaweedfs.volumeSizeLimitMB }} -volume.max={{ .Values.seaweedfs.maxVolumes }} -volume.minFreeSpace={{ .Values.seaweedfs.minFreeSpace | quote }} -s3 -s3.config=/tmp/s3.json
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
          resources: {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.seaweedfs.storage }}}}
