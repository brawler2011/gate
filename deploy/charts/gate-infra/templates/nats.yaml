apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: {app.kubernetes.io/name: nats}
  ports:
    - {name: client, port: 4222}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nats}
  template:
    metadata:
      labels: {app.kubernetes.io/name: nats}
    spec:
      # Services are found by DNS; their env variables (e.g. S3_PORT) would clash with app settings.
      enableServiceLinks: false
      securityContext:
        {{- include "gate-infra.podSecurity" . | nindent 8 }}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: [--js, --store_dir=/data, --http_port=8222]
          ports:
            - {name: client, containerPort: 4222}
            - {name: monitor, containerPort: 8222}
          readinessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 5
          resources: {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.nats.storage }}}}
