apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  {{- if .Values.postgres.nodePort }}
  type: NodePort
  {{- end }}
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - {name: postgres, port: 5432{{ with .Values.postgres.nodePort }}, nodePort: {{ . }}{{ end }}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      # Disable service env injection: names such as S3_PORT clash with application settings.
      enableServiceLinks: false
      # Run as the image user to avoid requiring gosu in the entrypoint.
      securityContext:
        {{- include "gate-infra.podSecurity" . | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        runAsNonRoot: true
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, {{ .Values.postgres.database | quote }}]}
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            # Mount the parent because PostgreSQL stores data in a versioned subdirectory.
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.postgres.storage }}}}
