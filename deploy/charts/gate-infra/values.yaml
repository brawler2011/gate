secretName: gate-secrets

postgres:
  image: postgres:18-alpine
  database: gate
  storage: 10Gi
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}

redis:
  image: redis:7.2.4-alpine
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 640Mi}
  maxMemory: 512mb

nats:
  image: nats:2.10-alpine
  storage: 5Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}

seaweedfs:
  image: chrislusf/seaweedfs:4.53_full
  storage: 50Gi
  minFreeSpace: "5GiB"
  volumeSizeLimitMB: 1024
  maxVolumes: 100
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}

appArmorProfile: {}
