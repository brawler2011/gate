secretName: gate-secrets

postgres:
  image: postgres:18-alpine
  database: gate
  storage: 10Gi
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}
  # Set to reach the service from the host (development).
  nodePort: null

redis:
  image: redis:7.2.4-alpine
  storage: 1Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 640Mi}
  maxMemory: 512mb
  nodePort: null

nats:
  image: nats:2.10-alpine
  storage: 5Gi
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 512Mi}
  nodePort: null

seaweedfs:
  image: chrislusf/seaweedfs:4.53_full
  storage: 50Gi
  minFreeSpace: "5GiB"
  volumeSizeLimitMB: 1024
  maxVolumes: 100
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 2Gi}
  nodePort: null

# Development only: go-judge for a backend running on the host.
judge:
  image: ""
  # Absolute host path of problems.work_dir.
  problemWork: ""
  nodePort: null

appArmorProfile: {}
