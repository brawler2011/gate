apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  config.yaml: |
    {{- required "backend.config is required (--set-file backend.config=deploy/<env>/config.yaml)" .Values.backend.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector: {app.kubernetes.io/name: backend}
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  # A new pod must be ready before an old one stops, so a release that never
  # becomes ready leaves the previous pods serving until Helm rolls it back.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend}
      annotations:
        checksum/config: {{ .Values.backend.config | sha256sum }}
    spec:
      # Services are found by DNS; their env variables (e.g. S3_PORT) would clash with app settings.
      enableServiceLinks: false
      securityContext:
        {{- include "gate.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      # go-judge runs next to the backend, which uploads files to it over HTTP and
      # runs them over gRPC; both must reach the same sandbox. As a native sidecar it
      # starts before the backend and stops after it, so running judgements finish.
      initContainers:
        - name: go-judge
          image: {{ .Values.goJudge.image }}:{{ include "gate.tag" . }}
          restartPolicy: Always
          # Loopback only: nothing outside the pod may run code in the sandbox.
          args: [-enable-grpc, -grpc-addr=127.0.0.1:5051, -http-addr=127.0.0.1:5050, -dir=/data]
          # The sandbox creates namespaces and cgroups for every run.
          # Privileged and unconfined: the sandbox mounts filesystems and filters each run
          # itself. The pod's AppArmor profile would otherwise apply here too, and a
          # Localhost profile denies the mounts.
          securityContext: {privileged: true, seccompProfile: {type: Unconfined}, appArmorProfile: {type: Unconfined}}
          resources: {{- toYaml .Values.goJudge.resources | nindent 12 }}
          volumeMounts:
            # File store on disk: large inputs and answers are not kept in sandbox memory.
            - {name: judge-data, mountPath: /data}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ include "gate.tag" . }}
          args: [-config=/etc/gate/config.yaml]
          env: {{- include "gate.backendEnv" . | trim | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Let Traefik drop the pod from its endpoints before the server shuts down.
            preStop: {sleep: {seconds: 5}}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/gate, readOnly: true}
            - {name: problem-work, mountPath: /problem-work}
      volumes:
        - name: config
          configMap: {name: backend-config}
        - name: problem-work
          emptyDir: {}
        - name: judge-data
          emptyDir: {}
