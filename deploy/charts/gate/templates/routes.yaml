{{- $host := required "ingress.host is required" .Values.ingress.host -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    customResponseHeaders:
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      X-Frame-Options: SAMEORIGIN
      X-Content-Type-Options: nosniff
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-ratelimit
spec:
  rateLimit: {average: 200, burst: 400, period: 1s}
---
# Scanner paths are refused at the edge: no client is allowed.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gate
spec:
  entryPoints: [{{ .Values.ingress.entryPoint }}]
  routes:
    - match: Host(`{{ $host }}`) && PathPrefix(`/api`)
      kind: Rule
      middlewares: [{name: security-headers}, {name: api-ratelimit}]
      services: [{name: backend, port: 8080}]
    - match: Host(`{{ $host }}`) && (PathRegexp(`^/(wp-admin|wp-content|phpmyadmin|webpack-dev|\.env|\.git)`) || PathRegexp(`.*\.php$`))
      kind: Rule
      middlewares: [{name: security-headers}, {name: deny-all}]
      services: [{name: backend, port: 8080}]
    # The SPA, /ws and /health.
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares: [{name: security-headers}]
      services: [{name: backend, port: 8080}]
  tls:
    {{- with .Values.ingress.certResolver }}
    certResolver: {{ . }}
    {{- else }} {}
    {{- end }}
