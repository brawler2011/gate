apiVersion: v1
kind: Service
metadata:
  name: go-judge
spec:
  selector: {app.kubernetes.io/name: go-judge}
  ports:
    - {name: grpc, port: 5051}
    - {name: http, port: 5050}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-judge
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: go-judge}
  # Never two pods behind the Service: each keeps uploaded files on its own disk, and
  # a run referring to a file uploaded to the other pod would fail as Internal Error.
  # While no pod is up, sandbox calls fail as unavailable and judge jobs are retried.
  strategy:
    type: Recreate
  template:
    metadata:
      labels: {app.kubernetes.io/name: go-judge}
    spec:
      # Services are found by DNS; their env variables (e.g. S3_PORT) would clash with app settings.
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: go-judge
          image: {{ .Values.goJudge.image }}:{{ include "gate.tag" . }}
          args: [-enable-grpc, -grpc-addr=0.0.0.0:5051, -http-addr=0.0.0.0:5050, -dir=/data]
          # The sandbox creates namespaces and cgroups for every run.
          securityContext: {privileged: true}
          ports:
            - {name: grpc, containerPort: 5051}
            - {name: http, containerPort: 5050}
          readinessProbe:
            tcpSocket: {port: grpc}
            periodSeconds: 5
          resources: {{- toYaml .Values.goJudge.resources | nindent 12 }}
          volumeMounts:
            # File store on disk: large inputs and answers are not kept in sandbox memory.
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
