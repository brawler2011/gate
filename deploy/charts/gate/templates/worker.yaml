apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: worker}
      annotations:
        checksum/config: {{ .Values.backend.config | sha256sum }}
    spec:
      enableServiceLinks: false
      securityContext:
        {{- include "gate.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      initContainers:
        # go-judge runs as many programs at once as the worker resolves from go_judge.parallelism.
        - name: judge-parallelism
          image: {{ .Values.backend.image }}:{{ include "gate.tag" . }}
          args: [-config=/etc/gate/config.yaml, -judge-parallelism=/run/judge/parallelism]
          env: {{- include "gate.backendEnv" . | trim | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/gate, readOnly: true}
            - {name: judge-run, mountPath: /run/judge}
        # Uploads and runs must reach the same go-judge file store.
        - name: go-judge
          image: {{ .Values.goJudge.image }}:{{ include "gate.tag" . }}
          restartPolicy: Always
          command: [/opt/runtime/bin/bash, -c, 'exec /opt/go-judge -mount-conf=/opt/mount.yaml -parallelism="$(cat /run/judge/parallelism)" "$@"', go-judge]
          # Only this pod may access sandbox execution.
          args: [-http-addr=127.0.0.1:5050, -dir=/data, -src-prefix=/problem-work/cache, -no-fallback]
          # Sandbox mounts require privileged mode and must bypass the pod's AppArmor profile.
          securityContext: {privileged: true, seccompProfile: {type: Unconfined}, appArmorProfile: {type: Unconfined}}
          resources: {{- toYaml .Values.goJudge.resources | nindent 12 }}
          volumeMounts:
            # Keep large inputs and answers out of sandbox memory.
            - {name: judge-data, mountPath: /data}
            - {name: problem-work, mountPath: /problem-work, readOnly: true}
            - {name: judge-run, mountPath: /run/judge, readOnly: true}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ include "gate.tag" . }}
          args: [-mode=worker, -config=/etc/gate/config.yaml]
          env: {{- include "gate.backendEnv" . | trim | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          {{- include "gate.backendProbes" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/gate, readOnly: true}
            - {name: problem-work, mountPath: /problem-work}
      volumes:
        - name: config
          configMap: {name: backend-config}
        - name: problem-work
          emptyDir: {}
        - name: judge-data
          emptyDir: {}
        - name: judge-run
          emptyDir: {}
