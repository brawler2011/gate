apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  config.yaml: |
    {{- required "backend.config is required (--set-file backend.config=deploy/<env>/config.yaml)" .Values.backend.config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8080}
---
# Serves HTTP and WebSocket and publishes submissions and builds; worker pods
# (templates/worker.yaml) run them. No sandbox: these pods cannot run user code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  # A new pod must be ready before an old one stops, so a release that never
  # becomes ready leaves the previous pods serving until Helm rolls it back.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
      annotations:
        checksum/config: {{ .Values.backend.config | sha256sum }}
    spec:
      # Services are found by DNS; their env variables (e.g. S3_PORT) would clash with app settings.
      enableServiceLinks: false
      securityContext:
        {{- include "gate.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      initContainers:
        # The API offers the languages of the judge image that the workers of this
        # release run, so it copies that image's manifest (judge.manifest_dir in the
        # config). The image is already on the node for the workers.
        - name: judge-manifest
          image: {{ .Values.goJudge.image }}:{{ include "gate.tag" . }}
          command: [/opt/runtime/bin/cp, -RL, /opt/manifest/., /etc/judge/]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
          volumeMounts:
            - {name: judge-manifest, mountPath: /etc/judge}
      containers:
        - name: backend
          image: {{ .Values.backend.image }}:{{ include "gate.tag" . }}
          args: [-mode=api, -config=/etc/gate/config.yaml]
          env: {{- include "gate.backendEnv" . | trim | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
          {{- include "gate.backendProbes" . | nindent 10 }}
          lifecycle:
            # Let Traefik drop the pod from its endpoints before the server shuts down.
            preStop: {sleep: {seconds: 5}}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/gate, readOnly: true}
            - {name: judge-manifest, mountPath: /etc/judge, readOnly: true}
            - {name: problem-work, mountPath: /problem-work}
      volumes:
        - name: config
          configMap: {name: backend-config}
        - name: judge-manifest
          emptyDir: {}
        - name: problem-work
          emptyDir: {}
