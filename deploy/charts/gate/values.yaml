imageTag: ""
imagePullSecrets: []

secretName: gate-secrets

backend:
  image: ghcr.io/brawler2011/gate-backend
  # Pass the environment config with --set-file backend.config=deploy/<env>/config.yaml.
  config: ""

api:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}

worker:
  replicas: 1
  # Strict judging needs Recreate: the new pod cannot get the old pod's exclusive cores.
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 2Gi}

goJudge:
  image: ghcr.io/brawler2011/gate-go-judge
  resources:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {memory: 4Gi}

ingress:
  host: ""
  # An empty resolver uses Traefik's default certificate.
  entryPoint: websecure
  certResolver: letsencrypt

appArmorProfile: {}
