# Memory limits may overcommit RAM; requests must leave room for app rollouts.
postgres:
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
seaweedfs:
  storage: 8Gi
  minFreeSpace: "5GiB"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
appArmorProfile:
  type: Localhost
  localhostProfile: gate-default
