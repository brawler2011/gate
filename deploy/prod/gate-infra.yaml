# Memory limits may overcommit RAM; requests must leave room for app rollouts.
postgres:
  storage: 5Gi
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
redis:
  storage: 1Gi
  maxMemory: 128mb
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 192Mi}
nats:
  storage: 2Gi
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {memory: 256Mi}
seaweedfs:
  storage: 8Gi
  minFreeSpace: "5GiB"
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
appArmorProfile:
  type: Localhost
  localhostProfile: gate-default
