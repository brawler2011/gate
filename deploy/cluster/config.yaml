http:
  address: :8080
  trusted_proxy: traefik-pods.kube-system.svc.cluster.local
  secure_cookies: true
go_judge:
  http_url: http://127.0.0.1:5050
  work_dir: /problem-work
  parallelism: 0
storage:
  s3_endpoint: http://s3:8333
email:
  provider: log
  from: Gate <no-reply@gate.localhost>
  app_base_url: https://gate.localhost:30443
judge:
  mode: dirty
  manifest_dir: /etc/judge
  workers: 4
problems:
  work_dir: /problem-work
  cache_bytes: 16GiB
  draft:
    file_bytes: 1MiB
    text_bytes: 8MiB
    files: 1000
    tests: 10000
    components: 100
    subtasks: 100
  limits:
    disk_bytes: 8GiB
    file_count: 25000
    object_bytes: 512MiB
    test_output_bytes: 512MiB
    wall_factor: 3
    compile:
      cpu: 40s
      memory: 512MiB
      processes: 150
      output: 64MiB
      diagnostic: 64KiB
    auxiliary:
      cpu: 5s
      memory: 256MiB
      processes: 50
      output: 512MiB
      diagnostic: 64KiB
    booklet:
      cpu: 30s
      memory: 512MiB
      processes: 100
      output: 64MiB
      diagnostic: 64KiB
  parallelism: 1
  attempts: 3
  lease: 30s
  poll: 1s
  duration: 30m
  upload_ttl: 5m
  gc_interval: 1m
  object_retention: 24h
  build_retention: 168h
  package_retention: 720h
  request_bytes: 16MiB
