services:
  backend:
    image: ghcr.io/brawler2011/gate-backend:${IMAGE_TAG:-dev}
    container_name: gate-backend-dev
    hostname: backend
    restart: unless-stopped
    environment:
      - ADDRESS=${BACKEND_ADDRESS:-:8080}
      - PRIVATE_ADDRESS=${BACKEND_PRIVATE_ADDRESS:-:8081}
      - POSTGRES_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_APP_DB:-gate}?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/${REDIS_DB_INDEX:-0}
      - NATS_URL=nats://${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GOJUDGE_GRPC_ADDR=go-judge:5051
      - S3_ENDPOINT=${S3_ENDPOINT:-http://s3:8333}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - STORAGE_TYPE=${STORAGE_TYPE:-s3}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${BACKEND_OTEL_ENDPOINT:-otel-collector:4317}
      - OTEL_SERVICE_NAME=${BACKEND_OTEL_SERVICE_NAME:-gate-backend}
    networks:
      - gate-dev
      - traefik-network
    depends_on:
      postgres:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      nats:
        condition: service_started
      go-judge:
        condition: service_started
      master:
        condition: service_started
      volume:
        condition: service_started
      filer:
        condition: service_started
      s3:
        condition: service_started
    labels:
      - "traefik.enable=true"
      # API router (/api)
      - "traefik.http.routers.gate-backend-dev.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.gate-backend-dev.service=gate-backend-dev-svc"
      - "traefik.http.routers.gate-backend-dev.entrypoints=websecure"
      - "traefik.http.routers.gate-backend-dev.tls=true"
      - "traefik.http.routers.gate-backend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gate-backend-dev.middlewares=gate-api-strip@file"
      # WS router (/ws)
      - "traefik.http.routers.gate-backend-dev-ws.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/ws`)"
      - "traefik.http.routers.gate-backend-dev-ws.service=gate-backend-dev-svc"
      - "traefik.http.routers.gate-backend-dev-ws.entrypoints=websecure"
      - "traefik.http.routers.gate-backend-dev-ws.tls=true"
      - "traefik.http.routers.gate-backend-dev-ws.tls.certresolver=letsencrypt"
      # Health router (/health)
      - "traefik.http.routers.gate-backend-dev-health.rule=Host(`${DOMAIN_NAME}`) && Path(`/health`)"
      - "traefik.http.routers.gate-backend-dev-health.service=gate-backend-dev-svc"
      - "traefik.http.routers.gate-backend-dev-health.entrypoints=websecure"
      - "traefik.http.routers.gate-backend-dev-health.tls=true"
      - "traefik.http.routers.gate-backend-dev-health.tls.certresolver=letsencrypt"
      # Port configuration
      - "traefik.http.services.gate-backend-dev-svc.loadbalancer.server.port=8080"

  backend-migrate:
    image: ghcr.io/brawler2011/gate-backend:${IMAGE_TAG:-dev}
    container_name: gate-backend-migrate-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_DSN=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_APP_DB:-gate}?sslmode=disable
    networks:
      - gate-dev
    command: ["--migrate"]
    restart: "no"

  frontend:
    image: ghcr.io/brawler2011/gate-frontend:${IMAGE_TAG:-dev}
    container_name: gate-frontend-dev
    hostname: frontend
    restart: unless-stopped
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://gate-backend-dev:8080}
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-/api}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://${DOMAIN_NAME}}
      - NEXT_PUBLIC_WEBSOCKET_URL=${NEXT_PUBLIC_WEBSOCKET_URL:-wss://${DOMAIN_NAME}/ws}
      - NEXT_PUBLIC_OTEL_EXPORTER_URL=${NEXT_PUBLIC_OTEL_EXPORTER_URL:-https://${DOMAIN_NAME}/otlp/v1/traces}
      - NEXT_PUBLIC_OTEL_SERVICE_NAME=${NEXT_PUBLIC_OTEL_SERVICE_NAME:-gate-frontend-browser}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-gate-frontend}
    networks:
      - gate-dev
      - traefik-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gate-frontend-dev.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.gate-frontend-dev.service=gate-frontend-dev-svc"
      - "traefik.http.routers.gate-frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.gate-frontend-dev.tls=true"
      - "traefik.http.routers.gate-frontend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.gate-frontend-dev-svc.loadbalancer.server.port=3000"

  postgres:
    image: postgres:18-alpine
    container_name: gate-postgres-dev
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - gate-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    container_name: gate-redis-dev
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - gate-dev

  nats:
    image: nats:2.10-alpine
    container_name: gate-nats-dev
    hostname: nats
    restart: unless-stopped
    command: ["--js", "--store_dir=/data"]
    volumes:
      - nats-data:/data
    networks:
      - gate-dev

  go-judge:
    image: ghcr.io/brawler2011/gate-go-judge:${IMAGE_TAG:-dev}
    container_name: gate-go-judge-dev
    hostname: go-judge
    restart: unless-stopped
    command:
      - "-enable-grpc"
      - "-grpc-addr=0.0.0.0:5051"
    privileged: true
    volumes:
      - ./go-judge-data:/data
    networks:
      - gate-dev

  master:
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-master-dev
    volumes:
      - seaweedfs-master:/data
    networks:
      - gate-dev
    command: "-v 9 master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324"
    restart: always

  volume:
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-volume-dev
    volumes:
      - seaweedfs-volume:/data
    networks:
      - gate-dev
    command: '-v 9 volume -mserver="master:9333" -ip=volume -ip.bind=0.0.0.0 -port=2 -dir=/data -max=100 -metricsPort=9325'
    depends_on:
      - master
    restart: always

  filer:
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-filer-dev
    volumes:
      - seaweedfs-filer:/data
    networks:
      - gate-dev
    command: '-v 9 filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    depends_on:
      - master
      - volume
    restart: always

  s3:
    image: chrislusf/seaweedfs:3.77_full
    container_name: gate-seaweed-s3-dev
    hostname: s3
    networks:
      - gate-dev
    command: '-v 9 s3 -filer="filer:8888" -ip.bind=0.0.0.0 -metricsPort=9327 -config=/etc/seaweedfs/s3.json'
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json
    depends_on:
      - master
      - volume
      - filer
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: gate-otel-collector-dev
    hostname: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../common/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started
      victoriametrics:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - gate-dev
      - traefik-network
    labels:
      - "traefik.enable=true"
      # OTLP Ingestion Router (/otlp)
      - "traefik.http.routers.gate-otlp-dev.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/otlp`)"
      - "traefik.http.routers.gate-otlp-dev.service=gate-otlp-dev-svc"
      - "traefik.http.routers.gate-otlp-dev.entrypoints=websecure"
      - "traefik.http.routers.gate-otlp-dev.tls=true"
      - "traefik.http.routers.gate-otlp-dev.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gate-otlp-dev.middlewares=gate-otlp-strip@file,gate-otlp-cors@file"
      - "traefik.http.services.gate-otlp-dev-svc.loadbalancer.server.port=4318"

  tempo:
    image: grafana/tempo:2.7.1
    container_name: gate-tempo-dev
    hostname: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../common/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - gate-dev

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.112.0
    container_name: gate-victoriametrics-dev
    hostname: victoriametrics
    restart: unless-stopped
    command:
      - "-storageDataPath=/vmetrics-data"
      - "-retentionPeriod=14d"
      - "-httpListenAddr=:8428"
    volumes:
      - victoriametrics-data:/vmetrics-data
    networks:
      - gate-dev

  loki:
    image: grafana/loki:3.4.1
    container_name: gate-loki-dev
    hostname: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../common/loki/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - gate-dev

  grafana:
    image: grafana/grafana:11.5.2
    container_name: gate-grafana-dev
    hostname: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../common/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../common/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      victoriametrics:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - gate-dev
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gate-grafana-dev.rule=Host(`grafana.${DOMAIN_NAME}`)"
      - "traefik.http.routers.gate-grafana-dev.service=gate-grafana-dev-svc"
      - "traefik.http.routers.gate-grafana-dev.entrypoints=websecure"
      - "traefik.http.routers.gate-grafana-dev.tls=true"
      - "traefik.http.routers.gate-grafana-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.gate-grafana-dev-svc.loadbalancer.server.port=3000"

volumes:
  postgres-data:
    name: gate-postgres-data-dev
  redis-data:
    name: gate-redis-data-dev
  nats-data:
    name: gate-nats-data-dev
  seaweedfs-master:
    name: gate-seaweedfs-master-dev
  seaweedfs-volume:
    name: gate-seaweedfs-volume-dev
  seaweedfs-filer:
    name: gate-seaweedfs-filer-dev
  victoriametrics-data:
    name: gate-victoriametrics-data-dev
  tempo-data:
    name: gate-tempo-data-dev
  loki-data:
    name: gate-loki-data-dev
  grafana-data:
    name: gate-grafana-data-dev

networks:
  gate-dev:
    name: gate-network-dev
    driver: bridge
  traefik-network:
    name: traefik-network
    external: true
