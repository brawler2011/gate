# Resource and retention policy, copied into every immutable build snapshot.
draft:
  file_bytes: 1048576
  text_bytes: 8388608
  files: 1000
  tests: 10000
  components: 100
  subtasks: 100
limits:
  disk_bytes: 8589934592
  file_count: 25000
  object_bytes: 536870912
  test_output_bytes: 536870912
  compile:
    cpu: 10s
    wall: 30s
    memory: 536870912
    processes: 150
    output: 67108864
    diagnostic: 65536
  auxiliary:
    cpu: 5s
    wall: 15s
    memory: 268435456
    processes: 50
    output: 536870912
    diagnostic: 65536
parallelism: 1
attempts: 3
lease: 30s
poll: 1s
duration: 30m
operation_lease: 10m
upload_ttl: 5m
gc_interval: 1m
object_retention: 24h
build_retention: 168h
package_retention: 720h
request_bytes: 16777216
